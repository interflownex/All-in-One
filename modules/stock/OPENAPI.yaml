openapi: 3.1.0
info:
  title: All-in-One STOCK API
  version: 0.3.0
servers:
  - url: /api/v1/stock
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: Healthy
  /version:
    get:
      security: []
      responses:
        '200':
          description: Version information
  /status:
    get:
      responses:
        '200':
          description: Operational status
  /metrics:
    get:
      responses:
        '200':
          description: Prometheus metrics
  /inventory/items:
    post:
      summary: Criar item autoritativo de inventário
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemCreate'
      responses:
        '201':
          description: Item de inventário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '403':
          description: Empresa autenticada não autorizada
        '409':
          description: SKU já cadastrado para empresa e localização
  /inventory/items/{inventory_item_id}:
    patch:
      summary: Ajustar quantidade física com versão otimista
      parameters:
        - $ref: '#/components/parameters/InventoryItemId'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjustment'
      responses:
        '200':
          description: Inventário ajustado e auditado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '404':
          description: Item não encontrado no escopo da empresa
        '409':
          description: Versão concorrente ou quantidade abaixo do reservado
  /reservations:
    post:
      summary: Reservar saldo em uma única transação PostgreSQL
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CausationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
      responses:
        '201':
          description: Reserva criada; repetição idêntica retorna a mesma reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockReservation'
        '404':
          description: Inventário não encontrado no escopo da empresa
        '409':
          description: Saldo insuficiente ou conflito de idempotência
        '422':
          description: Quantidade ou cabeçalho idempotente inválido
  /reservations/{reservation_id}/commit:
    post:
      summary: Confirmar baixa física de uma reserva válida
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Reserva confirmada idempotentemente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockReservation'
        '404':
          description: Reserva não encontrada
        '409':
          description: Reserva vencida ou em estado terminal incompatível
  /reservations/{reservation_id}/release:
    post:
      summary: Liberar saldo reservado
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRelease'
      responses:
        '200':
          description: Reserva liberada idempotentemente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockReservation'
        '404':
          description: Reserva não encontrada
        '409':
          description: Estado terminal incompatível
  /reservations/expire:
    post:
      summary: Expirar lote de reservas vencidas com SKIP LOCKED
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Lote de reservas expirado idempotentemente
        '403':
          description: Escopo de worker ou perfil operador ausente
  /calculations/unit-conversion:
    post:
      summary: Converter quantidades sem ponto flutuante binário
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
      responses:
        '200':
          description: Quantidade convertida
  /create:
    post:
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayload'
      responses:
        '201':
          description: Resource created
  /list:
    get:
      deprecated: true
      responses:
        '200':
          description: Resource collection
  /{id}:
    get:
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Resource detail
    patch:
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/ActorUserId'
      responses:
        '200':
          description: Resource updated
    delete:
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/ActorUserId'
      responses:
        '204':
          description: Resource soft-deleted
  /approve:
    post:
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionPayload'
      responses:
        '200':
          description: Resource approved
  /reject:
    post:
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionPayload'
      responses:
        '200':
          description: Resource rejected
  /audit:
    post:
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditPayload'
      responses:
        '201':
          description: Audit evidence accepted
  /catalog:
    get:
      responses:
        '200':
          description: Contracted domain resources
  /resources/{resource_type}:
    post:
      responses:
        '201':
          description: Domain resource created
    get:
      responses:
        '200':
          description: Authorized domain resource collection
  /resources/{resource_type}/{resource_id}:
    get:
      responses:
        '200':
          description: Authorized domain resource
    patch:
      responses:
        '200':
          description: Domain resource updated
    delete:
      responses:
        '204':
          description: Domain resource soft-deleted
  /resources/{resource_type}/{resource_id}/actions/{action}:
    post:
      responses:
        '200':
          description: Workflow transition recorded
  /audit/events:
    get:
      responses:
        '200':
          description: Immutable audit evidence
  /events/outbox:
    get:
      responses:
        '200':
          description: Transactional outbox domain events
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InventoryItemId:
      name: inventory_item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReservationId:
      name: reservation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorUserId:
      name: X-Actor-User-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    BusinessId:
      name: X-Business-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 160
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CausationId:
      name: X-Causation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
  schemas:
    InventoryItemCreate:
      type: object
      required: [user_id, company_id, product_id, sku, physical_quantity]
      properties:
        user_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        warehouse_id:
          type: [string, 'null']
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
          maxLength: 120
        physical_quantity:
          type: number
          minimum: 0
          multipleOf: 0.0001
        metadata:
          type: object
          additionalProperties: true
    InventoryAdjustment:
      type: object
      required: [expected_version, physical_quantity, reason]
      properties:
        expected_version:
          type: integer
          minimum: 0
        physical_quantity:
          type: number
          minimum: 0
          multipleOf: 0.0001
        reason:
          type: string
          minLength: 3
          maxLength: 500
    InventoryItem:
      type: object
      required:
        [id, user_id, company_id, product_id, sku, physical_quantity,
         reserved_quantity, available_quantity, version, status]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        warehouse_id:
          type: [string, 'null']
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        physical_quantity:
          type: string
        reserved_quantity:
          type: string
        available_quantity:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [active, blocked, depleted, archived]
    ReservationCreate:
      type: object
      required: [user_id, company_id, inventory_item_id, order_id, quantity]
      properties:
        user_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        inventory_item_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.0001
        expires_in_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 900
    ReservationRelease:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    StockReservation:
      type: object
      required:
        [reservation_id, user_id, company_id, order_id, inventory_item_id,
         quantity, status, expires_at, correlation_id]
      properties:
        reservation_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        inventory_item_id:
          type: string
          format: uuid
        quantity:
          type: string
        status:
          type: string
          enum: [pending, reserved, rejected, committed, released, expired]
        expires_at:
          type: string
          format: date-time
        committed_at:
          type: [string, 'null']
          format: date-time
        released_at:
          type: [string, 'null']
          format: date-time
        release_reason:
          type: [string, 'null']
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: [string, 'null']
          format: uuid
    CreatePayload:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        entity_id:
          type: string
          format: uuid
        status:
          type: string
        payload:
          type: object
          additionalProperties: true
    DecisionPayload:
      type: object
      required: [id, reason]
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 3
    AuditPayload:
      type: object
      required: [action, resource_type, resource_id]
      properties:
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
        payload:
          type: object
          additionalProperties: true
