openapi: 3.1.0
info:
  title: All-in-One Marketplace API
  version: 0.3.0
servers:
  - url: /api/v1/marketplace
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Healthy
  /version:
    get:
      security: []
      responses:
        "200":
          description: Version information
  /status:
    get:
      responses:
        "200":
          description: Operational status
  /metrics:
    get:
      responses:
        "200":
          description: Prometheus metrics
  /create:
    post:
      parameters:
        - $ref: "#/components/parameters/ActorUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayload"
      responses:
        "201":
          description: Resource created
  /list:
    get:
      responses:
        "200":
          description: Resource collection
  /{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Resource detail
    patch:
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/ActorUserId"
      responses:
        "200":
          description: Resource updated
    delete:
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/ActorUserId"
      responses:
        "204":
          description: Resource soft-deleted
  /approve:
    post:
      parameters:
        - $ref: "#/components/parameters/ActorUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionPayload"
      responses:
        "200":
          description: Resource approved
  /reject:
    post:
      parameters:
        - $ref: "#/components/parameters/ActorUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionPayload"
      responses:
        "200":
          description: Resource rejected
  /audit:
    post:
      parameters:
        - $ref: "#/components/parameters/ActorUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditPayload"
      responses:
        "201":
          description: Audit evidence accepted
  /catalog:
    get:
      responses:
        "200":
          description: Contracted domain resources
  /resources/{resource_type}:
    post:
      responses:
        "201":
          description: Domain resource created
    get:
      responses:
        "200":
          description: Authorized domain resource collection
  /resources/{resource_type}/{resource_id}:
    get:
      responses:
        "200":
          description: Authorized domain resource
    patch:
      responses:
        "200":
          description: Domain resource updated
    delete:
      responses:
        "204":
          description: Domain resource soft-deleted
  /resources/{resource_type}/{resource_id}/actions/{action}:
    post:
      responses:
        "200":
          description: Workflow transition recorded
  /audit/events:
    get:
      responses:
        "200":
          description: Immutable audit evidence
  /events/outbox:
    get:
      responses:
        "200":
          description: Transactional outbox domain events
  /valley/catalog:
    get:
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: category
          in: query
          schema:
            type: string
            maxLength: 80
        - name: store_id
          in: query
          schema:
            type: string
            format: uuid
        - name: min_price_brl
          in: query
          schema:
            type: number
            minimum: 0
        - name: max_price_brl
          in: query
          schema:
            type: number
            minimum: 0
        - name: latitude
          in: query
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: radius_km
          in: query
          schema:
            type: number
            exclusiveMinimum: 0
            maximum: 200
        - name: in_stock_only
          in: query
          schema:
            type: boolean
            default: true
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, distance, rating]
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Public catalog containing only approved stores and published products
        "422":
          description: Invalid filter combination
  /valley/feed:
    get:
      security: []
      responses:
        "200":
          description: Vertical product cards with sponsorship disclosure
  /valley/promotions/today:
    get:
      security: []
      responses:
        "200":
          description: Eligible promotion or an explicit empty state
  /valley/favorites:
    get:
      parameters:
        - $ref: "#/components/parameters/ActorUserId"
      responses:
        "200":
          description: Authenticated customer favorites
  /valley/favorites/{product_id}:
    put:
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/ActorUserId"
      responses:
        "200":
          description: Product added idempotently to favorites
        "409":
          description: Product unavailable
    delete:
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/ActorUserId"
      responses:
        "200":
          description: Product removed idempotently from favorites
  /valley/cart:
    get:
      parameters:
        - $ref: "#/components/parameters/ActorUserId"
      responses:
        "200":
          description: Cart summary with availability and BRL totals
  /valley/cart/items/{product_id}:
    put:
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/ActorUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemRequest"
      responses:
        "200":
          description: Cart item created or quantity replaced
        "409":
          description: Product unavailable
    delete:
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/ActorUserId"
      responses:
        "200":
          description: Cart item removed idempotently
  /valley/orders/{order_id}/support:
    post:
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportCaseRequest"
      responses:
        "201":
          description: Support or dispute case created
        "403":
          description: Order does not belong to the authenticated customer
        "409":
          description: Order is not eligible for support yet
  /valley/insights/commercial:
    get:
      responses:
        "200":
          description: Commercial metrics summary
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorUserId:
      name: X-Actor-User-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreatePayload:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        entity_id:
          type: string
          format: uuid
        status:
          type: string
        payload:
          type: object
          additionalProperties: true
    DecisionPayload:
      type: object
      required: [id, reason]
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 3
    AuditPayload:
      type: object
      required: [action, resource_type, resource_id]
      properties:
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
        payload:
          type: object
          additionalProperties: true
    CartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    SupportCaseRequest:
      type: object
      required: [kind, message, idempotency_key]
      properties:
        kind:
          type: string
          enum: [support, dispute]
        subject:
          type: string
        message:
          type: string
        desired_resolution:
          type: string
        idempotency_key:
          type: string
