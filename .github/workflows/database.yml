      - name: Exercise Jobs typed persistence and private CTPS vault
        env:
          ALL_IN_ONE_JOBS_POSTGRES_TEST_DSN: postgresql://all_in_one:test-password@localhost:5432/all_in_one
        run: python -m pytest -q tests/test_jobs_postgres_integration.py
      - name: Dispatch PostgreSQL outbox to RabbitMQ with immutable delivery evidence
        env:
          ALL_IN_ONE_OUTBOX_POSTGRES_TEST_DSN: postgresql://all_in_one:test-password@localhost:5432/all_in_one
          ALL_IN_ONE_RABBITMQ_TEST_URL: amqp://all_in_one:test-password@localhost:5672/%2F
        run: python -m pytest -q tests/test_outbox_rabbitmq_integration.py
      - name: Prove Marketplace checkout migration rollback in the ephemeral database
        run: |
          psql -h localhost -U all_in_one -d all_in_one -v ON_ERROR_STOP=1 -f database/postgres/rollbacks/032_marketplace_checkout_attempts.sql
          test "$(psql -h localhost -U all_in_one -d all_in_one -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'marketplace' AND table_name = 'checkout_attempts';")" = "0"
      - name: Prove Stock migration rollback in the ephemeral database
