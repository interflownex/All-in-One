name: Database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        "database/**",
        "modules/shared/**",
        "workers/**",
        "infra/docker/docker-compose.yml",
        "tests/test_jobs_postgres_integration.py",
        "tests/test_marketplace_checkout_integration.py",
        "tests/test_outbox_rabbitmq_integration.py",
        "tests/test_postgres_contract_static.py",
        "tests/test_postgres_priority_stores_integration.py",
        "tests/test_postgres_stores_matrix.py",
        "tests/test_stock_reservations_integration.py",
        "scripts/validate_postgres_real_dsn.py",
        "scripts/verify_pg_indexes.py",
        "requirements-dev.txt",
        ".github/workflows/database.yml",
      ]
  pull_request:
    paths:
      [
        "database/**",
        "modules/shared/**",
        "workers/**",
        "infra/docker/docker-compose.yml",
        "tests/test_jobs_postgres_integration.py",
        "tests/test_marketplace_checkout_integration.py",
        "tests/test_outbox_rabbitmq_integration.py",
        "tests/test_postgres_contract_static.py",
        "tests/test_postgres_priority_stores_integration.py",
        "tests/test_postgres_stores_matrix.py",
        "tests/test_stock_reservations_integration.py",
        "scripts/validate_postgres_real_dsn.py",
        "scripts/verify_pg_indexes.py",
        "requirements-dev.txt",
        ".github/workflows/database.yml",
      ]

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: all_in_one
          POSTGRES_USER: all_in_one
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U all_in_one -d all_in_one"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: all_in_one
          RABBITMQ_DEFAULT_PASS: test-password
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: test-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations
        run: |
          for file in database/postgres/migrations/*.sql; do
            psql -h localhost -U all_in_one -d all_in_one -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Confirm immutable triggers
        run: |
          test "$(psql -h localhost -U all_in_one -d all_in_one -Atc "SELECT COUNT(*) FROM pg_trigger WHERE tgname IN ('immutable_audit_logs','immutable_event_deliveries','immutable_finance_ledger','immutable_valley_gold_ledger','immutable_jobs_resume_documents','immutable_jobs_resume_access_logs');")" = "6"
          test "$(psql -h localhost -U all_in_one -d all_in_one -Atc "SELECT COUNT(*) FROM pg_trigger WHERE tgname = 'protect_marketplace_checkout_attempt';")" = "1"
      - name: Validate PostgreSQL contract constants against migrations
        run: python -m pytest -q tests/test_postgres_contract_static.py
      - name: Validate PostgreSQL real contract by DSN
        env:
          ALL_IN_ONE_POSTGRES_MATRIX_DSN: postgresql://all_in_one:test-password@localhost:5432/all_in_one
        run: python scripts/validate_postgres_real_dsn.py --write-checks
      - name: Exercise Finance PostgreSQL store
        env:
          ALL_IN_ONE_POSTGRES_MATRIX_DSN: postgresql://all_in_one:test-password@localhost:5432/all_in_one
        run: python -m pytest -q tests/test_postgres_priority_stores_integration.py::test_finance_wallet_create_get_list_and_outbox
      - name: Exercise Business PostgreSQL store
        env:
          ALL_IN_ONE_POSTGRES_MATRIX_DSN: postgresql://all_in_one:test-password@localhost:5432/all_in_one
        run: python -m pytest -q tests/test_postgres_priority_stores_integration.py::test_business_company_create_get_list_and_soft_delete
      - name: Exercise Marketplace PostgreSQL store
        env:
          ALL_IN_ONE_POSTGRES_MATRIX_DSN: postgresql://all_in_one:test-password@localhost:5432/all_in_one
        run: python -m pytest -q tests/test_postgres_priority_stores_integration.py::test_marketplace_store_create_get_list_and_outbox
      - name: Exercise Marketplace checkout transaction
        env:
          ALL_IN_ONE_MARKETPLACE_CHECKOUT_TEST_DSN: postgresql://all_in_one:test-password@localhost:5432/all_in_one
        run: python -m pytest -q tests/test_marketplace_checkout_integration.py
      - name: Exercise Services PostgreSQL store
