name: V2.9 Isolate Generated Artifacts Gate

on:
  push:
    branches:
      - fix/cicd-governanca-v2-8-2026-07-27
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isolate-generated-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cicd-governanca-v2-8-2026-07-27
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cleanup artifacts
        run: python scripts/cleanup_artifacts.py

      - name: Run baseline checks separately
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics/v29

          run_check() {
            local name="$1"
            shift
            set +e
            "$@" >"diagnostics/v29/${name}.before.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" >"diagnostics/v29/${name}.before.rc"
            echo "${name}.before: ${rc}" | tee -a diagnostics/v29/summary.txt
          }

          set -e
          run_check scaffold python scripts/scaffold_modules.py --check
          run_check fixtures python scripts/generate_domain_event_fixtures.py --check
          run_check openapi python scripts/validate_openapi.py
          run_check repository python scripts/validate_repository.py

      - name: Apply confirmed validator corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_repository.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'if len(slugs) != 25:\n        fail(f"Esperados 25 modulos; catalogo possui {len(slugs)}.", errors)',
                  'if len(slugs) != 24:\n        fail(f"Esperados 24 modulos ativos; catalogo possui {len(slugs)}.", errors)',
              ),
              (
                  '            "pip-audit --local",',
                  '            "pip-audit -r requirements-dev.txt",',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Trecho inesperado no validador: {old!r}')

          old_brand = '''        for relative in [
              brand.get("platform_brand", {}).get("logo_asset"),
              brand.get("platform_brand", {}).get("light_logo_asset"),
              brand.get("valley_brand", {}).get("logo_asset"),
          ]:
              if not relative or not (ROOT / relative).is_file():
                  fail(f"Ativo oficial de marca ausente: {relative}", errors)
          if set(brand.get("valley_apps", [])) != {
              "valley",
              "valley-business",
              "valley-rider",
          }:
              fail("Branding deve declarar exatamente os apps Valley oficiais.", errors)
'''
          new_brand = '''        required_brand_assets = [
              brand.get("platform_brand", {}).get("logo_asset"),
              brand.get("valley_brand", {}).get("logo_asset"),
          ]
          optional_light_logo = brand.get("platform_brand", {}).get(
              "light_logo_asset"
          )
          if optional_light_logo:
              required_brand_assets.append(optional_light_logo)
          for relative in required_brand_assets:
              if not relative or not (ROOT / relative).is_file():
                  fail(f"Ativo oficial de marca ausente: {relative}", errors)
          if set(brand.get("valley_apps", [])) != {
              "valley",
              "valley-business",
          }:
              fail("Branding deve declarar exatamente os apps Valley oficiais.", errors)
          if set(brand.get("riders_apps", [])) != {
              "valley-rider",
              "all-in-one-riders",
          }:
              fail(
                  "Branding deve declarar exatamente os apps Riders oficiais.", errors
              )
'''
          if old_brand in text:
              text = text.replace(old_brand, new_brand, 1)
          elif new_brand not in text:
              raise SystemExit('Bloco de branding inesperado no validador.')

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile scripts/validate_repository.py
          git diff --check
          changed="$(git diff --name-only)"
          test -z "$changed" || test "$changed" = "scripts/validate_repository.py"

      - name: Run corrected checks separately
        shell: bash
        run: |
          set -u

          run_check() {
            local name="$1"
            shift
            set +e
            "$@" >"diagnostics/v29/${name}.after.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" >"diagnostics/v29/${name}.after.rc"
            echo "${name}.after: ${rc}" | tee -a diagnostics/v29/summary.txt
          }

          set -e
          run_check scaffold python scripts/scaffold_modules.py --check
          run_check fixtures python scripts/generate_domain_event_fixtures.py --check
          run_check openapi python scripts/validate_openapi.py
          run_check repository python scripts/validate_repository.py

          git status --short > diagnostics/v29/git-status.txt
          git diff --name-status > diagnostics/v29/git-diff-name-status.txt
          find apps -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort > diagnostics/v29/app-directories.txt

          {
            echo '## Isolamento e remediação do gate de artefatos v2.9'
            echo
            echo '| Comando | Antes | Depois |'
            echo '|---|---:|---:|'
            for name in scaffold fixtures openapi repository; do
              printf '| `%s` | %s | %s |\n' "$name" \
                "$(cat diagnostics/v29/${name}.before.rc)" \
                "$(cat diagnostics/v29/${name}.after.rc)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for name in scaffold fixtures openapi repository; do
            if [ "$(cat diagnostics/v29/${name}.after.rc)" -ne 0 ]; then
              failed=1
            fi
          done
          printf '%s\n' "$failed" > diagnostics/v29/final.rc

      - name: Commit exact validator correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Validador já estava corrigido."
          else
            git config user.name "all-in-one-ci"
            git config user.email "actions@users.noreply.github.com"
            git add scripts/validate_repository.py
            git commit -m "fix(validation): alinhar catálogo, segurança e branding [v29-validator-fix]"
            git push origin HEAD:fix/cicd-governanca-v2-8-2026-07-27
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v29-generated-gate-diagnostics
          path: diagnostics/v29
          if-no-files-found: error
          retention-days: 14

      - name: Enforce corrected gate
        shell: bash
        run: |
          test "$(cat diagnostics/v29/final.rc)" -eq 0
