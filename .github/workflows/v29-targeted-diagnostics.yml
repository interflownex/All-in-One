name: V2.9 Targeted Diagnostics

on:
  push:
    branches:
      - fix/cicd-governanca-v2-8-2026-07-27
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies quietly
        run: pip install -q -r requirements-dev.txt
      - name: Run first failing unit test
        shell: bash
        run: |
          mkdir -p diagnostics/v29/unit
          set +e
          python -m pytest -q -x --tb=short --ignore=tests/e2e \
            > diagnostics/v29/unit/pytest.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > diagnostics/v29/unit/pytest.rc
          cat diagnostics/v29/unit/pytest.log
          exit "$rc"
      - name: Upload unit diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v29-unit-diagnostic
          path: diagnostics/v29/unit
          if-no-files-found: error
          retention-days: 14

  bandit-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install -q bandit
      - name: Generate Bandit evidence
        shell: bash
        run: |
          mkdir -p diagnostics/v29/bandit
          set +e
          bandit -r modules/shared scripts workers -ll -f json \
            -o diagnostics/v29/bandit/report.json
          rc=$?
          set -e
          printf '%s\n' "$rc" > diagnostics/v29/bandit/bandit.rc
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path('diagnostics/v29/bandit/report.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          results = payload.get('results', [])
          severity = Counter(item.get('issue_severity') for item in results)
          confidence = Counter(item.get('issue_confidence') for item in results)
          summary = {
              'total': len(results),
              'severity': dict(sorted(severity.items())),
              'confidence': dict(sorted(confidence.items())),
              'first_findings': [
                  {
                      'filename': item.get('filename'),
                      'line_number': item.get('line_number'),
                      'test_id': item.get('test_id'),
                      'severity': item.get('issue_severity'),
                      'confidence': item.get('issue_confidence'),
                      'text': item.get('issue_text'),
                  }
                  for item in results[:25]
              ],
          }
          Path('diagnostics/v29/bandit/summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          exit "$rc"
      - name: Upload Bandit diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v29-bandit-diagnostic
          path: diagnostics/v29/bandit
          if-no-files-found: error
          retention-days: 14

  android-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android stages separately
        shell: bash
        run: |
          mkdir -p diagnostics/v29/android

          run_stage() {
            local name="$1"
            shift
            set +e
            "$@" >"diagnostics/v29/android/${name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" >"diagnostics/v29/android/${name}.rc"
            echo "${name}: ${rc}" | tee -a diagnostics/v29/android/summary.txt
          }

          chmod +x apps/valley-android/gradlew
          run_stage contract python scripts/validate_valley_android_release.py
          run_stage unit apps/valley-android/gradlew -p apps/valley-android testDebugUnitTest --no-daemon
          run_stage lint apps/valley-android/gradlew -p apps/valley-android lintDebug --no-daemon
          run_stage assemble apps/valley-android/gradlew -p apps/valley-android assembleDebug --no-daemon

          cat diagnostics/v29/android/summary.txt
          failed=0
          for stage in contract unit lint assemble; do
            if [ "$(cat diagnostics/v29/android/${stage}.rc)" -ne 0 ]; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload Android diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v29-android-diagnostic
          path: diagnostics/v29/android
          if-no-files-found: error
          retention-days: 14
