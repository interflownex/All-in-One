name: Valley Rider Flutter APK Produção

on:
  workflow_dispatch:
  push:
    tags:
      - "valley-rider-flutter-v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  rider-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_API_HUB_URL: https://all-in-one-api-hub.web.app
      VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN_PRODUCTION }}
      MAPBOX_MOBILE_ACCESS_TOKEN: ${{ secrets.MAPBOX_MOBILE_ACCESS_TOKEN_PRODUCTION }}
      TARGET_ENVIRONMENT: production
      MAPBOX_TEST_REFERER: https://brasildesconto.com.br
    steps:
      - uses: actions/checkout@v4

      - name: Exigir credenciais de produção
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$VITE_MAPBOX_ACCESS_TOKEN" == pk.* ]]
          [[ "$MAPBOX_MOBILE_ACCESS_TOKEN" == pk.* ]]

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/valley_rider/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Validar Mapbox produção e compilar Rider
        run: |
          node scripts/mapbox/validate_valley_rider_mapbox.mjs
          npm --prefix apps/valley_rider ci
          npm --prefix apps/valley_rider run lint
          npm --prefix apps/valley_rider run build

      - name: Materializar Android Rider
        run: |
          flutter_project="$(mktemp -d)"
          flutter create \
            --platforms=android \
            --org br.com.interflownex \
            --project-name valley_rider \
            "$flutter_project"
          cp -R "$flutter_project/android" apps/valley-flutter/android
          python3 scripts/configure_valley_flutter_android.py --label "Valley Rider"
          python3 scripts/configure_valley_flutter_android.py --check --label "Valley Rider"
          python3 scripts/prepare_valley_flutter_build.py --variant rider
          python3 scripts/prepare_valley_flutter_build.py --check --variant rider

      - name: Validar e gerar APKs Rider
        working-directory: apps/valley-flutter
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build apk --release --dart-define=VALLEY_APP_NAME="Valley Rider"
          flutter build apk --release --split-per-abi --dart-define=VALLEY_APP_NAME="Valley Rider"

      - name: Auditar APKs Rider
        run: >-
          python3 scripts/audit_valley_flutter_apks.py
          apps/valley-flutter/build/app/outputs/flutter-apk
          --expected-text "Valley Rider"

      - name: Atestar proveniência
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: apps/valley-flutter/build/app/outputs/flutter-apk/*.apk

      - name: Publicar artefato Rider produção
        uses: actions/upload-artifact@v7
        with:
          name: valley-rider-flutter-production-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/valley-flutter/build/app/outputs/flutter-apk/app-release.apk
            apps/valley-flutter/build/app/outputs/flutter-apk/app-*-release.apk
