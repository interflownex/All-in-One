name: Valley Universal MCP

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/valley-universal-web-mobile-*"
    paths:
      - "apps/valley-universal-mcp/**"
      - ".github/workflows/valley-universal-mcp.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/valley-universal-mcp/**"
      - ".github/workflows/valley-universal-mcp.yml"

permissions:
  contents: read

concurrency:
  group: valley-universal-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/valley-universal-mcp

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar tipagem
        run: npm run typecheck

      - name: Validar inicialização do servidor
        run: |
          npm run start > /tmp/valley-mcp.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            STATUS=$(curl --silent --output /tmp/valley-mcp-response.txt \
              --write-out '%{http_code}' http://127.0.0.1:3000/mcp || true)
            if [ "$STATUS" != "000" ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/valley-mcp.log
          exit 1
