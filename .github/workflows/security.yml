name: Security

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  python-security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip==26.1.2
      - run: pip install -r requirements-dev.txt pip-audit bandit
      - run: pip-audit --local
      - run: bandit -r modules/shared scripts workers -q -ll
      - run: python -m pytest -q tests/test_security_gates.py

  container-image-security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-hub
            dockerfile: modules/api_hub/Dockerfile
            image_ref: all-in-one-api-hub:security
          - name: identity
            dockerfile: modules/identity/Dockerfile
            image_ref: all-in-one-identity:security
          - name: jobs
            dockerfile: modules/jobs/Dockerfile
            image_ref: all-in-one-jobs:security
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagem crítica
        run: docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.image_ref }}" .
      - name: Verificar vulnerabilidades altas e críticas
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ matrix.image_ref }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  javascript-security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/all-in-one
          - apps/all-in-one-business
          - apps/all-in-one-health
          - apps/all-in-one-mobility
          - apps/all-in-one-riders
          - apps/all-in-one-services
          - apps/valley
          - apps/valley_business
          - apps/valley_rider
          - desktop/valley-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Auditar dependências JavaScript
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            output="$(npm audit --omit=dev --audit-level=critical 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s' "$output" | grep -Eq 'audit endpoint returned an error|invalid json response body'; then
              echo "Registro npm retornou resposta inválida; repetindo auditoria (${attempt}/3)."
              continue
            fi
            exit "$status"
          done
          echo "Registro npm permaneceu indisponível após três tentativas."
          exit 1

  valley-android-security:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Inicializar CodeQL para Java e Kotlin
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Submeter grafo completo de dependências Gradle
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: apps/valley-android
          dependency-graph: ${{ github.event_name == 'pull_request' && 'generate-and-upload' || 'generate-and-submit' }}
      - name: Validar, testar, analisar e empacotar Android
        run: |
          python scripts/validate_valley_android_release.py
          apps/valley-android/gradlew -p apps/valley-android \
            testStagingDebugUnitTest lintStagingDebug assembleStagingDebug --no-daemon
      - name: Publicar análise SAST CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: valley-android-java-kotlin
