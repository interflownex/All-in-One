name: Security

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  python-security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip==26.1.2
      - run: pip install -r requirements-dev.txt pip-audit bandit
      - run: pip-audit --local
      - run: bandit -r modules/shared scripts workers -q -ll
      - run: python -m pytest -q tests/test_security_gates.py

  javascript-security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/all-in-one
          - apps/all-in-one-business
          - apps/all-in-one-health
          - apps/all-in-one-mobility
          - apps/all-in-one-riders
          - apps/all-in-one-services
          - apps/valley
          - apps/valley_business
          - apps/valley_rider
          - desktop/valley-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: ${{ matrix.app }}

  container-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: modules/api_hub/Dockerfile
            image: all-in-one-api-hub:security
          - dockerfile: modules/identity/Dockerfile
            image: all-in-one-identity:security
          - dockerfile: modules/jobs/Dockerfile
            image: all-in-one-jobs:security
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .
      - name: Scan container for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  valley-android-security:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Inicializar CodeQL para Java e Kotlin
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Submeter grafo completo de dependências Gradle
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: apps/valley-android
          dependency-graph: ${{ github.event_name == 'pull_request' && 'generate-and-upload' || 'generate-and-submit' }}
      - name: Validar, testar, analisar e empacotar Android
        run: |
          python scripts/validate_valley_android_release.py
          apps/valley-android/gradlew -p apps/valley-android \
            testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Publicar análise SAST CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: valley-android-java-kotlin
