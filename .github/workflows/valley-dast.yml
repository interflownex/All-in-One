name: Valley DAST

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "modules/identity/**"
      - "modules/shared/**"
      - "scripts/evaluate_zap_report.py"
      - ".github/workflows/valley-dast.yml"
  push:
    branches: [main]
    paths:
      - "modules/identity/**"
      - "modules/shared/**"
  schedule:
    - cron: "43 5 * * 3"

permissions:
  contents: read

jobs:
  active-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALL_IN_ONE_ENV: development
      ALL_IN_ONE_JWT_SECRET: valley-dast-synthetic-secret-not-for-production
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar backend efêmero
        run: pip install -r modules/identity/requirements.txt
      - name: Iniciar Identity somente no runner autorizado
        run: |
          cd modules/identity
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > "$RUNNER_TEMP/identity-dast.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/identity-dast.pid"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          exit 1
      - name: Resolver endereço interno do host Docker
        run: |
          DAST_HOST="$(ip -f inet -o addr show docker0 | awk '{print $4}' | cut -d '/' -f 1)"
          test -n "$DAST_HOST"
          echo "DAST_TARGET=http://${DAST_HOST}:8000" >> "$GITHUB_ENV"
      - name: Executar ZAP Full Scan ativo
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: ${{ env.DAST_TARGET }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          allow_issue_writing: false
          fail_action: false
          artifact_name: valley-zap-full-scan
          cmd_options: "-a -m 2 -T 5"
      - name: Aplicar gate High e gerar resumo sanitizado
        run: >-
          python scripts/evaluate_zap_report.py
          report_json.json
          --summary valley-zap-summary.json
          --fail-at high
      - name: Preservar evidências DAST
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valley-dast-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            report_json.json
            report_html.html
            report_md.md
            valley-zap-summary.json
      - name: Encerrar backend efêmero
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/identity-dast.pid" || kill "$(cat "$RUNNER_TEMP/identity-dast.pid")" || true
