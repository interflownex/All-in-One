name: Valley Universal Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/valley-universal-web-mobile-*"
    paths:
      - "apps/valley-android/universal/**"
      - "apps/valley-android/settings.gradle.kts"
      - "assets/brand/valley-logo-official.png"
      - ".github/workflows/valley-universal-android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/valley-android/universal/**"
      - "apps/valley-android/settings.gradle.kts"
      - "assets/brand/valley-logo-official.png"
      - ".github/workflows/valley-universal-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: valley-universal-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Validar aplicação web e backend
        run: |
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 \
            https://84e9680fcfa2a84551.v2.appdeploy.ai/ \
            --output /tmp/valley-universal.html
          test -s /tmp/valley-universal.html
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 \
            https://api-v2.appdeploy.ai/app/84e9680fcfa2a84551/api/_healthcheck \
            --output /tmp/valley-universal-health.json
          grep -q 'Success' /tmp/valley-universal-health.json

      - name: Validar ativo oficial
        run: test -s assets/brand/valley-logo-official.png

      - name: Testar, analisar e gerar APK
        working-directory: apps/valley-android
        run: |
          chmod +x gradlew
          ./gradlew \
            :universal:testDebugUnitTest \
            :universal:lintDebug \
            :universal:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Preparar APK e checksum
        run: |
          cp apps/valley-android/universal/build/outputs/apk/debug/universal-debug.apk \
            Valley-Universal-1.0.0-debug.apk
          sha256sum Valley-Universal-1.0.0-debug.apk \
            > Valley-Universal-1.0.0-debug.apk.sha256

      - name: Publicar instalador Android
        uses: actions/upload-artifact@v7
        with:
          name: valley-universal-android-1.0.0-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            Valley-Universal-1.0.0-debug.apk
            Valley-Universal-1.0.0-debug.apk.sha256