name: Deploy to GKE (Cloud Build/GitOps)

on:
  workflow_dispatch:
    inputs:
      confirm_gcp_billing_enabled:
        description: "Confirmo que billing/IAM/APIs GCP estao legitimos para executar deploy GKE"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  GOOGLE_CLOUD_ENABLED: "false"

jobs:
  local-first-guard:
    if: ${{ inputs.confirm_gcp_billing_enabled != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Registrar bloqueio local-first
        run: |
          echo "Deploy GKE nao executado."
          echo "O workspace esta em modo local-first sem Google Cloud pago."
          echo "Acione manualmente com confirm_gcp_billing_enabled=true somente apos billing/IAM/APIs legitimos."

  deploy:
    if: ${{ inputs.confirm_gcp_billing_enabled == true }}
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_ENABLED: "true"
      GCP_PROJECT_ID: all-in-one-498012
      GKE_CLUSTER: all-in-one-gke
      GKE_REGION: us-central1
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIP }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "latest"

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "$GKE_CLUSTER" \
            --region "$GKE_REGION" \
            --project "$GCP_PROJECT_ID"

      - name: Create Kubernetes secrets from Secret Manager
        run: |
          kubectl delete secret all-in-one-secrets --namespace=all-in-one --ignore-not-found=true
          DB_PASS=$(gcloud secrets versions access latest --secret=DATABASE_PASSWORD --project="$GCP_PROJECT_ID")
          JWT=$(gcloud secrets versions access latest --secret=JWT_SECRET --project="$GCP_PROJECT_ID")
          SENTRY=$(gcloud secrets versions access latest --secret=SENTRY_DSN --project="$GCP_PROJECT_ID")
          kubectl create secret generic all-in-one-secrets --namespace=all-in-one \
            --from-literal=DATABASE_PASSWORD="$DB_PASS" \
            --from-literal=JWT_SECRET="$JWT" \
            --from-literal=SENTRY_DSN="$SENTRY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply kustomize manifests
        run: |
          kubectl apply -k infra/kubernetes
