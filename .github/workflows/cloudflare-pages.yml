name: Publicar ambiente web no Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/all-in-one/**"
      - ".github/workflows/cloudflare-pages.yml"

concurrency:
  group: cloudflare-pages-all-in-one
  cancel-in-progress: true

env:
  WRANGLER_VERSION: "4.118.0"
  HAS_TELEGRAM_DELIVERY: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: apps/all-in-one
    steps:
      - name: Conferir credenciais Cloudflare
        id: credentials
        working-directory: ${{ github.workspace }}
        env:
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_CLOUDFLARE_API_TOKEN" = "true" ] && [ "$HAS_CLOUDFLARE_ACCOUNT_ID" = "true" ]; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice title=Cloudflare Pages nao publicado::Defina CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em GitHub Secrets para habilitar o deploy automatico."
          echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.deploy_enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.credentials.outputs.deploy_enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/all-in-one/package-lock.json
      - run: npm ci
        if: steps.credentials.outputs.deploy_enabled == 'true'
      - run: npm run build
        if: steps.credentials.outputs.deploy_enabled == 'true'
        env:
          VITE_API_HUB_URL: ${{ vars.VITE_API_HUB_URL }}
      - name: Publicar no Cloudflare Pages
        if: steps.credentials.outputs.deploy_enabled == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/all-in-one
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist --project-name all-in-one-web --branch main --commit-hash ${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Encaminhar ambiente web pronto via Telegram
        if: steps.credentials.outputs.deploy_enabled == 'true' && env.HAS_TELEGRAM_DELIVERY == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/send_ready_artifact_to_telegram.py --kind web --url "$DEPLOYMENT_URL" --version "$GITHUB_SHA" --expected-marker "<title>All-in-One — Ecossistema Digital</title>" --verified
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
