name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/all-in-one/**"
      - ".github/workflows/cloudflare-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/all-in-one/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    defaults:
      run:
        working-directory: apps/all-in-one

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/all-in-one/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: all-in-one-superapp
          directory: apps/all-in-one/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name == 'main' && 'main' || github.head_ref }}
