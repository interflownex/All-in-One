name: Publicar ambiente web no Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/all-in-one/**"
      - ".github/workflows/cloudflare-pages.yml"

concurrency:
  group: cloudflare-pages-all-in-one
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: apps/all-in-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/all-in-one/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_HUB_URL: ${{ vars.VITE_API_HUB_URL }}
      - name: Publicar no Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/all-in-one
          wranglerVersion: "4.112.0"
          command: pages deploy dist --project-name all-in-one-web --branch main --commit-hash ${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Encaminhar ambiente web pronto via Telegram
        working-directory: ${{ github.workspace }}
        run: python3 scripts/send_ready_artifact_to_telegram.py --kind web --url "$DEPLOYMENT_URL" --version "$GITHUB_SHA" --expected-marker "<title>All-in-One — Ecossistema Digital</title>" --verified
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
