name: Publicar ambiente web no Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/all-in-one/**"
      - ".github/workflows/cloudflare-pages.yml"

concurrency:
  group: cloudflare-pages-all-in-one
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/all-in-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/all-in-one/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_HUB_URL: ${{ vars.VITE_API_HUB_URL }}
      - name: Publicar no Cloudflare Pages
        run: npx --yes wrangler@4.112.0 pages deploy dist --project-name all-in-one-web --branch main --commit-hash "$GITHUB_SHA" --commit-message "${{ github.event.head_commit.message || 'Publicacao manual All-in-One' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
