name: V2.8 Regenerate Generated Artifacts

on:
  push:
    branches:
      - fix/cicd-governanca-v2-8-2026-07-27

permissions:
  contents: write

concurrency:
  group: v28-regenerate-artifacts
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: fix/cicd-governanca-v2-8-2026-07-27
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate artifacts from canonical catalog
        run: python scripts/scaffold_modules.py

      - name: Verify generated artifacts
        run: python scripts/check_generated_artifacts.py

      - name: Validate diff safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          deleted="$(git diff --diff-filter=D --name-only)"
          if [ -n "$deleted" ]; then
            echo "Unexpected generated-file deletions:"
            printf '%s\n' "$deleted"
            exit 1
          fi

          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "No generated drift remains."
            exit 0
          fi

          invalid="$(printf '%s\n' "$changed" | grep -Ev '^(modules/|contracts/|apps/)' || true)"
          if [ -n "$invalid" ]; then
            echo "Generator changed paths outside the approved scope:"
            printf '%s\n' "$invalid"
            exit 1
          fi

          echo "Approved generated changes:"
          printf '%s\n' "$changed"

      - name: Commit generated artifacts when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules contracts apps
          git commit -m "fix(ci): sincronizar artefatos gerados"
          git push origin HEAD:fix/cicd-governanca-v2-8-2026-07-27
