name: Stitch Coordination Guard

on:
  workflow_dispatch:
    inputs:
      execute_remote_fallback:
        description: "Executar sincronizacao remota de fallback usando o mesmo diretor Codex"
        required: false
        default: false
        type: boolean
      allow_create_missing_official_projects:
        description: "Autorizar a criacao remota de projeto oficial ausente, como o AIO Admin"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "config/autonomy/**stitch**"
      - "config/autonomy/google_integrations_policy.json"
      - "config/stitch/**"
      - "scripts/codex_stitch_director.py"
      - "scripts/stitch_*.py"
      - "scripts/validate_repository_compat.py"
      - "tests/test_*stitch*.py"
      - ".github/workflows/stitch-sync.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "config/autonomy/**stitch**"
      - "config/autonomy/google_integrations_policy.json"
      - "config/stitch/**"
      - "scripts/codex_stitch_director.py"
      - "scripts/stitch_*.py"
      - "scripts/validate_repository_compat.py"
      - "tests/test_*stitch*.py"
      - ".github/workflows/stitch-sync.yml"
permissions:
  contents: read

concurrency:
  group: stitch-coordination-${{ github.ref }}
  cancel-in-progress: false

env:
  STITCH_REMOTE_SYNC_ENABLED: "false"
  STITCH_COORDINATOR: "codex"
  STITCH_LEGACY_MODULE_SYNC_ENABLED: "false"

jobs:
  validate-coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install httpx pytest

      - name: Materializar configuracao segura do Codex MCP
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<'EOF'
          [mcp_servers.stitch]
          url = "https://stitch.googleapis.com/mcp"
          http_headers = { Accept = "application/json" }
          env_http_headers = { "X-Goog-Api-Key" = "STITCH_API_KEY" }
          EOF

      - name: Validar politica, segredo e configuracao MCP
        run: python scripts/validate_stitch_mcp_config.py

      - name: Validar direcao Codex e coordenadas oficiais
        run: |
          python scripts/codex_stitch_director.py plan
          python scripts/codex_stitch_director.py status --actor github-actions-validator

      - name: Executar testes de governanca Stitch
        run: python -m pytest -q tests/test_codex_stitch_director.py tests/test_stitch_orchestrator.py

  remote-fallback:
    if: github.event_name == 'workflow_dispatch' && inputs.execute_remote_fallback == true
    needs: validate-coordination
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
      STITCH_REMOTE_SYNC_ENABLED: "true"
      CODEX_AGENT_ID: github-actions-fallback
      ALLOW_CREATE_MISSING_PROJECTS: ${{ inputs.allow_create_missing_official_projects }}
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install httpx

      - name: Materializar configuracao segura do Codex MCP
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<'EOF'
          [mcp_servers.stitch]
          url = "https://stitch.googleapis.com/mcp"
          http_headers = { Accept = "application/json" }
          env_http_headers = { "X-Goog-Api-Key" = "STITCH_API_KEY" }
          EOF

      - name: Executar lote remoto pelo diretor Codex
        run: |
          python scripts/validate_stitch_mcp_config.py --require-secret
          CREATE_FLAG=""
          if [ "$ALLOW_CREATE_MISSING_PROJECTS" = "true" ]; then
            CREATE_FLAG="--allow-create-missing-projects"
          fi
          python scripts/codex_stitch_director.py sync \
            --max-operations 8 \
            $CREATE_FLAG \
            --actor github-actions-fallback

      - name: Versionar checkpoint oficial, inclusive quando parcial
        run: |
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/stitch/template_project_state.json
          git diff --cached --quiet || git commit -m "chore(stitch): atualizar checkpoint coordenado pelo Codex"
          git push

      - name: Confirmar conclusao integral do checkpoint
        run: python scripts/codex_stitch_director.py status --require-complete --actor github-actions-fallback
