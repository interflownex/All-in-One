name: Codex Publish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'codex/ambiente-desenvolvimento-persistente'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ambiente-desenvolvimento-persistente
          fetch-depth: 0
      - name: Apply validated patch
        run: |
          git apply --check .codex-publish.patch
          git apply .codex-publish.patch
          rm .codex-publish.patch
      - name: Commit final tree
        run: |
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): estabilizar validacoes do ambiente persistente"
          git push origin HEAD:codex/ambiente-desenvolvimento-persistente
