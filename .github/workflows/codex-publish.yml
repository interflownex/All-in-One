name: Codex Publish Validated Changes

on:
  push:
    branches:
      - codex/ambiente-desenvolvimento-persistente
    paths:
      - .codex-publish.patch
      - .github/workflows/codex-publish.yml

permissions:
  contents: write

concurrency:
  group: codex-publish-validated-changes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch validado
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=error .codex-publish.patch
          rm .codex-publish.patch .github/workflows/codex-publish.yml
          git add -A
          git diff --cached --check

      - name: Publicar commit final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: configurar ambiente de desenvolvimento persistente"
          git push origin HEAD:codex/ambiente-desenvolvimento-persistente
