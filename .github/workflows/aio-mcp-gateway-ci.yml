name: aio-mcp-gateway-ci

on:
  pull_request:
    paths:
      - "services/aio-mcp-gateway/**"
      - ".github/workflows/aio-mcp-gateway-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/aio-mcp-gateway/**"
      - ".github/workflows/aio-mcp-gateway-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/aio-mcp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/aio-mcp-gateway/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy main.py
      - name: Tests
        run: pytest
      - name: Compile
        run: python -m compileall -q main.py tests

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t aio-mcp-gateway:test services/aio-mcp-gateway
      - name: Start container
        run: docker run --rm -d --name aio-mcp-gateway -p 8080:8080 aio-mcp-gateway:test
      - name: Health check
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs aio-mcp-gateway
          exit 1
      - name: Stop container
        if: always()
        run: docker stop aio-mcp-gateway || true
