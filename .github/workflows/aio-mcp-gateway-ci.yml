name: aio-mcp-gateway-ci

on:
  pull_request:
    paths:
      - "services/aio-mcp-gateway/**"
      - "scripts/configure_cloudflare_mcp_dns.py"
      - "tests/test_cloudflare_mcp_dns.py"
      - "tests/test_cloudflare_mcp_https_health.py"
      - ".github/workflows/aio-mcp-gateway-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/aio-mcp-gateway/**"
      - "scripts/configure_cloudflare_mcp_dns.py"
      - "tests/test_cloudflare_mcp_dns.py"
      - "tests/test_cloudflare_mcp_https_health.py"
      - ".github/workflows/aio-mcp-gateway-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: services/aio-mcp-gateway
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/aio-mcp-gateway/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip==26.1.2 && pip install -e ".[dev]"
      - name: Apply reviewed HTTPS health hardening
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'feat/mcp-production-hardening-20260804' &&
          github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/configure_cloudflare_mcp_dns.py")
          content = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "import urllib.parse\nimport urllib.request\n",
                  "import urllib.parse\n",
              ),
              (
                  'DNS_LABEL_PATTERN = re.compile(r"^(?!-)[a-z0-9-]{1,63}(?<!-)$")\n',
                  'DNS_LABEL_PATTERN = re.compile(r"^(?!-)[a-z0-9-]{1,63}(?<!-)$")\n'
                  'ALLOWED_HEALTH_HOSTS = frozenset(\n'
                  '    {\n'
                  '        "mcp.brasildesconto.com.br",\n'
                  '        "mcp-staging.brasildesconto.com.br",\n'
                  '        "mcp-preview.brasildesconto.com.br",\n'
                  '    }\n'
                  ')\n',
              ),
              (
                  '''def verify_https(health_url: str) -> None:\n    request = urllib.request.Request(\n        health_url,\n        headers={"User-Agent": "aio-mcp-dns-validator/1.0"},\n    )\n    with urllib.request.urlopen(request, timeout=20) as response:\n        if response.status != 200:\n            raise RuntimeError(\n                f"health check retornou HTTP {response.status}: {health_url}"\n            )\n        payload = json.loads(response.read().decode("utf-8"))\n    if payload.get("status") != "ok":\n        raise RuntimeError(f"health check não retornou status=ok: {health_url}")\n''',
                  '''def verify_https(health_url: str) -> None:\n    parsed = urllib.parse.urlsplit(health_url)\n    try:\n        port = parsed.port\n    except ValueError as exc:\n        raise ConfigurationError("health URL contém porta inválida") from exc\n\n    hostname = (parsed.hostname or "").casefold().rstrip(".")\n    if (\n        parsed.scheme.casefold() != "https"\n        or hostname not in ALLOWED_HEALTH_HOSTS\n        or parsed.path.rstrip("/") != "/health"\n        or port not in (None, 443)\n        or parsed.username is not None\n        or parsed.password is not None\n        or parsed.query\n        or parsed.fragment\n    ):\n        raise ConfigurationError(\n            "health URL deve usar HTTPS, porta 443, host aprovado e /health"\n        )\n\n    connection = http.client.HTTPSConnection(hostname, 443, timeout=20)\n    try:\n        connection.request(\n            "GET",\n            "/health",\n            headers={\n                "User-Agent": "aio-mcp-dns-validator/1.0",\n                "Accept": "application/json",\n            },\n        )\n        response = connection.getresponse()\n        raw = response.read()\n    finally:\n        connection.close()\n\n    if response.status != 200:\n        raise RuntimeError(\n            f"health check retornou HTTP {response.status}: {health_url}"\n        )\n    try:\n        payload = json.loads(raw.decode("utf-8"))\n    except (UnicodeDecodeError, json.JSONDecodeError) as exc:\n        raise RuntimeError(\n            f"health check retornou JSON inválido: {health_url}"\n        ) from exc\n    if not isinstance(payload, Mapping) or payload.get("status") != "ok":\n        raise RuntimeError(f"health check não retornou status=ok: {health_url}")\n''',
              ),
          ]

          for old, new in replacements:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one reviewed replacement, found {count}: {old[:80]!r}"
                  )
              content = content.replace(old, new)

          path.write_text(content, encoding="utf-8")
          PY
          ruff format \
            scripts/configure_cloudflare_mcp_dns.py \
            tests/test_cloudflare_mcp_https_health.py
      - name: Commit HTTPS hardening to the MCP branch
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'feat/mcp-production-hardening-20260804' &&
          github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ${{ github.workspace }}
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/configure_cloudflare_mcp_dns.py \
            tests/test_cloudflare_mcp_https_health.py
          git diff --cached --quiet && { echo "Expected HTTPS patch produced no changes"; exit 1; }
          git commit -m "fix(cloudflare): enforce fixed HTTPS health boundary"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: >-
          mypy main.py security.py production_invariants.py request_limits.py
          deploy/render_cloud_run.py
          deploy/rollback_cloud_run.py
      - name: Gateway tests
        run: pytest
      - name: Cloudflare DNS tests
        working-directory: ${{ github.workspace }}
        run: >-
          python -m pytest
          tests/test_cloudflare_mcp_dns.py
          tests/test_cloudflare_mcp_https_health.py
          tests/test_cloudflare_wsl_configuration.py
      - name: Compile
        run: >-
          python -m compileall -q
          main.py security.py production_invariants.py request_limits.py deploy tests
      - name: Remove local package from audit inventory
        run: python -m pip uninstall --yes aio-mcp-gateway
      - name: Audit Python dependencies
        run: pip-audit --strict --progress-spinner off
      - name: Generate application SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Package attestable source
        run: >-
          tar -czf aio-mcp-gateway-source.tgz
          main.py security.py production_invariants.py request_limits.py
          pyproject.toml SPEC.md README.md Dockerfile
          .env.example deploy
      - name: Upload quality evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aio-mcp-gateway-quality-${{ github.sha }}
          path: |
            services/aio-mcp-gateway/sbom.cdx.json
            services/aio-mcp-gateway/aio-mcp-gateway-source.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Attest source with SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: services/aio-mcp-gateway/aio-mcp-gateway-source.tgz
          sbom-path: services/aio-mcp-gateway/sbom.cdx.json
          create-storage-record: false

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build container
        run: docker build --pull -t aio-mcp-gateway:${{ github.sha }} services/aio-mcp-gateway
      - name: Start container
        run: >-
          docker run -d --name aio-mcp-gateway
          -p 8080:8080
          aio-mcp-gateway:${{ github.sha }}
      - name: Health check
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            if [ "$(docker inspect --format='{{.State.Running}}' aio-mcp-gateway 2>/dev/null || true)" != "true" ]; then
              echo "Container encerrou antes de ficar saudável."
              docker ps -a
              docker logs aio-mcp-gateway || true
              exit 1
            fi
            sleep 1
          done
          echo "Timeout aguardando /health."
          docker ps -a
          docker logs aio-mcp-gateway || true
          exit 1
      - name: Scan image for high and critical findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aio-mcp-gateway:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          scanners: vuln,secret
      - name: Generate image SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aio-mcp-gateway:${{ github.sha }}
          format: cyclonedx
          output: image-sbom.cdx.json
          exit-code: "0"
          scanners: vuln
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aio-mcp-gateway-container-${{ github.sha }}
          path: image-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove container
        if: always()
        run: docker rm -f aio-mcp-gateway || true
