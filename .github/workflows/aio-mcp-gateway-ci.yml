name: aio-mcp-gateway-ci

on:
  pull_request:
    paths:
      - "services/aio-mcp-gateway/**"
      - ".github/workflows/aio-mcp-gateway-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/aio-mcp-gateway/**"
      - ".github/workflows/aio-mcp-gateway-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: services/aio-mcp-gateway
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/aio-mcp-gateway/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip==26.1.2 && pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: >-
          mypy main.py security.py production_invariants.py
          deploy/render_cloud_run.py
          deploy/rollback_cloud_run.py
      - name: Tests
        run: pytest
      - name: Compile
        run: >-
          python -m compileall -q
          main.py security.py production_invariants.py deploy tests
      - name: Audit Python dependencies
        run: pip-audit --strict --progress-spinner off
      - name: Generate application SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Package attestable source
        run: >-
          tar -czf aio-mcp-gateway-source.tgz
          main.py security.py production_invariants.py
          pyproject.toml SPEC.md README.md Dockerfile
          .env.example deploy
      - name: Upload quality evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aio-mcp-gateway-quality-${{ github.sha }}
          path: |
            services/aio-mcp-gateway/sbom.cdx.json
            services/aio-mcp-gateway/aio-mcp-gateway-source.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Attest source with SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: services/aio-mcp-gateway/aio-mcp-gateway-source.tgz
          sbom-path: services/aio-mcp-gateway/sbom.cdx.json
          create-storage-record: false

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build container
        run: docker build --pull -t aio-mcp-gateway:${{ github.sha }} services/aio-mcp-gateway
      - name: Start container
        run: docker run --rm -d --name aio-mcp-gateway -p 8080:8080 aio-mcp-gateway:${{ github.sha }}
      - name: Health check
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs aio-mcp-gateway
          exit 1
      - name: Scan image for high and critical findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aio-mcp-gateway:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          scanners: vuln,secret
      - name: Generate image SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aio-mcp-gateway:${{ github.sha }}
          format: cyclonedx
          output: image-sbom.cdx.json
          exit-code: "0"
          scanners: vuln
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aio-mcp-gateway-container-${{ github.sha }}
          path: image-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stop container
        if: always()
        run: docker stop aio-mcp-gateway || true
