name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "36 5 * * 6"

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Set up Android SDK
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: android-actions/setup-android@v4

      - name: Install Android 36
        if: ${{ matrix.language == 'java-kotlin' }}
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Build Android sources for CodeQL
        if: ${{ matrix.language == 'java-kotlin' }}
        working-directory: apps/valley-android
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:assembleProductionDebug \
            :admin:assembleDebug \
            :universal:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
