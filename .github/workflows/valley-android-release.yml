name: Valley Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "valley-android-v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    environment: google-play-production
    env:
      VALLEY_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.VALLEY_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
      VALLEY_PLAY_APP_SIGNING_CERT_SHA256: ${{ secrets.VALLEY_PLAY_APP_SIGNING_CERT_SHA256 }}
      VALLEY_RELEASE_SIGNING_PROPERTIES: /tmp/valley-release.properties
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Materializar chave de upload fora do workspace
        env:
          KEYSTORE_BASE64: ${{ secrets.VALLEY_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VALLEY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VALLEY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VALLEY_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/valley-upload.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/valley-upload.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$VALLEY_RELEASE_SIGNING_PROPERTIES"

      - name: Validar contrato e assinatura de upload
        env:
          VALLEY_RELEASE_KEY_ALIAS: ${{ secrets.VALLEY_RELEASE_KEY_ALIAS }}
        run: |
          python scripts/validate_valley_android_release.py
          python scripts/configure_valley_android_signing.py \
            --check \
            --keystore "$RUNNER_TEMP/valley-upload.jks" \
            --properties "$VALLEY_RELEASE_SIGNING_PROPERTIES" \
            --alias "$VALLEY_RELEASE_KEY_ALIAS"

      - name: Testar e gerar APK e AAB release
        working-directory: apps/valley-android
        run: ./gradlew testReleaseUnitTest assembleRelease bundleRelease --no-daemon

      - name: Auditar conteúdo e certificado do APK
        run: >-
          python scripts/audit_valley_apk.py
          apps/valley-android/app/build/outputs/apk/release/app-release.apk
          --android-sdk "$ANDROID_HOME"
          --require-release-signature

      - name: Gerar SBOM CycloneDX do artefato
        uses: anchore/sbom-action@v0
        with:
          path: apps/valley-android/app/build/outputs/apk/release/app-release.apk
          format: cyclonedx-json
          output-file: valley-android-release.cdx.json

      - name: Atestar proveniência do APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/valley-android/app/build/outputs/apk/release/app-release.apk

      - name: Publicar artefatos para aprovação Play App Signing
        uses: actions/upload-artifact@v4
        with:
          name: valley-android-signed-release
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/valley-android/app/build/outputs/apk/release/app-release.apk
            apps/valley-android/app/build/outputs/bundle/release/app-release.aab
            apps/valley-android/app/build/outputs/mapping/release/mapping.txt
            valley-android-release.cdx.json
