name: Refresh Generated Contracts

on:
  workflow_dispatch:
  push:
    branches:
      - fix/generated-artifacts-gate
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref_name == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remover bloco residual do Vision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("modules/shared/domain_rules.py")
          text = path.read_text(encoding="utf-8")
          start_marker = '''        ("device_fingerprint",),
              sensitive=True,
          ),
          '''
          end_marker = '''    ("legal", "cases"): ResourceRule(
          '''
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Bloco residual Vision nao foi localizado com seguranca.")
          text = text[:start] + end_marker + text[end + len(end_marker):]
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Validar sintaxe e commit
        run: |
          python -m py_compile modules/shared/domain_rules.py
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add modules/shared/domain_rules.py
          git diff --cached --quiet || git commit -m "fix: remover regras orfas do Vision"
          git push
