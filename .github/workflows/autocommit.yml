name: Refresh Generated Contracts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar marcador da variante Android
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate_valley_android_release.py")
          text = path.read_text(encoding="utf-8")
          old = '        "testDebugUnitTest lintDebug assembleDebug",\n'
          new = '        "testStagingDebugUnitTest lintStagingDebug assembleStagingDebug",\n'
          if text.count(old) != 1:
              raise SystemExit("Marcador Android antigo não encontrado exatamente uma vez.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
      - name: Validar e registrar
        run: |
          python scripts/validate_valley_android_release.py
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/validate_valley_android_release.py
          git diff --cached --quiet || git commit -m "fix: validar variante Android StagingDebug"
          git push origin HEAD:${{ github.head_ref }}
