name: Apply PR 34 repair patch

on:
  push:
    branches:
      - fix/generated-artifacts-gate
    paths:
      - reports/ci/fix-pr34.patch.gz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generated-artifacts-gate
          fetch-depth: 2
      - name: Validar e aplicar correções
        shell: bash
        run: |
          set -Eeuo pipefail
          gunzip -c reports/ci/fix-pr34.patch.gz > /tmp/fix-pr34.patch
          git apply --check -p1 /tmp/fix-pr34.patch
          git apply -p1 /tmp/fix-pr34.patch
          rm -f reports/ci/fix-pr34.patch.gz
          git show HEAD^:.github/workflows/autocommit.yml > .github/workflows/autocommit.yml
      - name: Versionar correções verificadas
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name all-in-one-repair-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --quiet || git commit -m "fix: concluir correções do gate e da suíte"
          git push origin HEAD:fix/generated-artifacts-gate
