name: Refresh Generated Contracts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerar contratos e artefatos controlados
        run: |
          python scripts/scaffold_modules.py
          python scripts/generate_domain_event_fixtures.py
          python scripts/generate_data_audit_inventory.py
      - name: Validar alterações geradas
        run: |
          python scripts/scaffold_modules.py --check
          python scripts/generate_domain_event_fixtures.py --check
          python scripts/validate_openapi.py
          python scripts/validate_repository.py
      - name: Versionar somente alterações geradas
        run: |
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps modules contracts config docs/data-audit
          git diff --cached --check
          git diff --cached --quiet || git commit -m "chore: atualizar contratos e artefatos gerados"
          git push
