name: Refresh Generated Contracts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remover bloco residual do Vision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("modules/shared/domain_rules.py")
          text = path.read_text(encoding="utf-8")
          health_rule = '''    ("health", "beds"): ResourceRule(
              ("unit",), sensitive=True, transitions=lifecycle_flow("health.bed")
          ),
          '''
          legal_rule = '''    ("legal", "cases"): ResourceRule(
          '''
          health_start = text.find(health_rule)
          if health_start < 0:
              raise SystemExit("Regra health.beds nao encontrada.")
          start = health_start + len(health_rule)
          end = text.find(legal_rule, start)
          if end < 0:
              raise SystemExit("Regra legal.cases nao encontrada após health.beds.")
          text = text[:start] + text[end:]
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Validar sintaxe e commit
        run: |
          python -m py_compile modules/shared/domain_rules.py
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add modules/shared/domain_rules.py
          git diff --cached --quiet || git commit -m "fix: remover regras orfas do Vision"
          git push origin HEAD:${{ github.head_ref }}
