name: Diagnose PR34 Senior Fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Execute repair script in diagnostic mode
        shell: bash
        run: |
          set +e
          mkdir -p reports/ci
          python scripts/apply_pr34_senior_fix.py > reports/ci/pr34-senior-fix-diagnostic.txt 2>&1
          status=$?
          {
            echo
            echo "SCRIPT_EXIT=$status"
            echo "GIT_STATUS:"
            git status --short
          } >> reports/ci/pr34-senior-fix-diagnostic.txt
          cat reports/ci/pr34-senior-fix-diagnostic.txt
          exit 0
      - name: Upload senior fix diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr34-senior-fix-diagnostic-${{ github.run_id }}
          path: reports/ci/pr34-senior-fix-diagnostic.txt
          if-no-files-found: error
          retention-days: 2
