name: Refresh Generated Contracts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: all_in_one
          POSTGRES_USER: all_in_one
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U all_in_one -d all_in_one"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Corrigir identificador reservado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("database/postgres/migrations/029_unified_immutable_audit.sql"): [
                  ("ADD COLUMN IF NOT EXISTS authorization TEXT,", 'ADD COLUMN IF NOT EXISTS "authorization" TEXT,'),
              ],
              Path("database/postgres/rollbacks/029_unified_immutable_audit.down.sql"): [
                  ("DROP COLUMN IF EXISTS authorization,", 'DROP COLUMN IF EXISTS "authorization",'),
              ],
              Path("modules/shared/audit_contract.py"): [
                  ("correlation_id, causation_id, occurred_at, result, error_detail, authorization, approval_id,", 'correlation_id, causation_id, occurred_at, result, error_detail, "authorization", approval_id,'),
              ],
          }
          for path, changes in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in changes:
                  if text.count(old) != 1:
                      raise SystemExit(f"Padrão não localizado exatamente uma vez em {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")

          diagnostic = Path("reports/ci/postgres-migration-diagnostic.txt")
          if diagnostic.exists():
              diagnostic.unlink()
          PY
      - name: Validar todas as migrações
        shell: bash
        run: |
          set -euo pipefail
          for file in database/postgres/migrations/*.sql; do
            echo "Aplicando $file"
            psql -h localhost -U all_in_one -d all_in_one -v ON_ERROR_STOP=1 -f "$file"
          done
          python -m py_compile modules/shared/audit_contract.py
      - name: Commit database fix
        run: |
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A database/postgres/migrations/029_unified_immutable_audit.sql database/postgres/rollbacks/029_unified_immutable_audit.down.sql modules/shared/audit_contract.py reports/ci/postgres-migration-diagnostic.txt
          git diff --cached --quiet || git commit -m "fix: citar coluna authorization na auditoria PostgreSQL"
          git push origin HEAD:${{ github.head_ref }}
