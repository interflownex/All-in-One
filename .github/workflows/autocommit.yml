name: Refresh Generated Contracts

on:
  workflow_dispatch:
  push:
    branches:
      - fix/generated-artifacts-gate
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref_name == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Incluir cryptography no template Identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/scaffold_modules.py")
          text = path.read_text(encoding="utf-8")
          old = '''        return (
              "fastapi==0.136.1\\n"
          '''
          new = '''        return (
              "cryptography==48.0.1\\n"
              "fastapi==0.136.1\\n"
          '''
          identity_start = text.index('    if slug == "identity":')
          identity_end = text.index('    if slug == "jobs":', identity_start)
          section = text[identity_start:identity_end]
          if old not in section:
              raise SystemExit("Template Identity esperado nao encontrado.")
          section = section.replace(old, new, 1)
          text = text[:identity_start] + section + text[identity_end:]
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Commit scaffold dependency fix
        run: |
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/scaffold_modules.py
          git diff --cached --quiet || git commit -m "fix: incluir cryptography no template Identity"
          git push
