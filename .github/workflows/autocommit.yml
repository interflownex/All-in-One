name: Refresh Generated Contracts

on:
  workflow_dispatch:
  push:
    branches:
      - fix/generated-artifacts-gate
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref_name == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Gerar diagnostico por comando
        shell: bash
        run: |
          mkdir -p reports/ci
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          commands = [
              [sys.executable, "scripts/scaffold_modules.py", "--check"],
              [sys.executable, "scripts/generate_domain_event_fixtures.py", "--check"],
              [sys.executable, "scripts/validate_openapi.py"],
              [sys.executable, "scripts/validate_repository.py"],
          ]

          lines = ["# Diagnostico do gate de artefatos gerados", ""]
          for command in commands:
              result = subprocess.run(command, text=True, capture_output=True)
              lines.extend([
                  f"## {' '.join(command)}",
                  f"exit_code: {result.returncode}",
                  "```text",
                  (result.stdout + result.stderr).strip() or "<sem saida>",
                  "```",
                  "",
              ])
          Path("reports/ci/generated-artifacts-diagnostic.md").write_text(
              "\n".join(lines), encoding="utf-8", newline="\n"
          )
          PY
      - name: Commit diagnostic report
        run: |
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ci/generated-artifacts-diagnostic.md
          git diff --cached --quiet || git commit -m "ci: registrar diagnostico do gate de artefatos"
          git push
