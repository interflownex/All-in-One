name: Refresh Generated Contracts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capturar falha Android
        shell: bash
        run: |
          mkdir -p reports/ci
          set +e
          {
            python scripts/validate_valley_android_release.py
            apps/valley-android/gradlew -p apps/valley-android testDebugUnitTest lintDebug assembleDebug --no-daemon
          } > reports/ci/android-security-diagnostic.txt 2>&1
          status=$?
          echo "exit_code=$status" >> reports/ci/android-security-diagnostic.txt
          tail -n 300 reports/ci/android-security-diagnostic.txt
          exit 0
      - name: Commit diagnostic report
        run: |
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ci/android-security-diagnostic.txt
          git diff --cached --quiet || git commit -m "ci: registrar diagnostico Android"
          git push origin HEAD:${{ github.head_ref }}
