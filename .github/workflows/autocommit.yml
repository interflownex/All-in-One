name: Refresh Generated Contracts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Capturar falhas unitárias
        shell: bash
        run: |
          mkdir -p reports/ci
          set +e
          python -m pytest -q --tb=short --maxfail=40 --ignore=tests/e2e > reports/ci/unit-tests-final-diagnostic.txt 2>&1
          status=$?
          echo "pytest_exit_code=$status" >> reports/ci/unit-tests-final-diagnostic.txt
          tail -n 300 reports/ci/unit-tests-final-diagnostic.txt
          exit 0
      - name: Commit diagnostic report
        run: |
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ci/unit-tests-final-diagnostic.txt
          git diff --cached --quiet || git commit -m "ci: registrar diagnostico final dos testes unitarios"
          git push origin HEAD:${{ github.head_ref }}
