name: Diagnose PR34 Repair Patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Validate stored patch
        shell: bash
        run: |
          set +e
          mkdir -p reports/ci
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "PATCH_SHA256=$(sha256sum reports/ci/fix-pr34.patch.gz | awk '{print $1}')"
            gunzip -c reports/ci/fix-pr34.patch.gz > /tmp/fix-pr34.patch
            echo "PATCH_LINES=$(wc -l < /tmp/fix-pr34.patch)"
            echo "PATCH_FILES:"
            grep '^diff --git ' /tmp/fix-pr34.patch || true
            echo "CHECK_P0:"
            git apply --check -p0 /tmp/fix-pr34.patch
            echo "CHECK_P0_EXIT=$?"
            echo "CHECK_P1:"
            git apply --check -p1 /tmp/fix-pr34.patch
            echo "CHECK_P1_EXIT=$?"
          } > reports/ci/pr34-patch-diagnostic.txt 2>&1
          cat reports/ci/pr34-patch-diagnostic.txt
          exit 0
      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr34-patch-diagnostic-${{ github.run_id }}
          path: reports/ci/pr34-patch-diagnostic.txt
          if-no-files-found: error
          retention-days: 2
