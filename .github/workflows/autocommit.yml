name: Apply Residual PR34 Fixes

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: all_in_one
          POSTGRES_USER: all_in_one
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U all_in_one -d all_in_one"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: test-password
      ALL_IN_ONE_POSTGRES_MATRIX_DSN: postgresql://all_in_one:test-password@localhost:5432/all_in_one
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Aplicar correções residuais
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          root = Path('.')

          migration_path = root / 'database/postgres/migrations/028_dynamic_forms_governance.sql'
          migration = migration_path.read_text(encoding='utf-8')
          migration = re.sub(r'CREATE TABLE (?!IF NOT EXISTS )forms\.', 'CREATE TABLE IF NOT EXISTS forms.', migration)
          migration = re.sub(r'CREATE INDEX (?!IF NOT EXISTS )', 'CREATE INDEX IF NOT EXISTS ', migration)
          constraints = {
              'form_definitions_current_version_fk': 'forms.form_definitions',
              'form_blocks_visibility_fk': 'forms.form_blocks',
              'form_fields_visibility_fk': 'forms.form_fields',
          }
          for constraint, table in constraints.items():
              drop = f'ALTER TABLE {table} DROP CONSTRAINT IF EXISTS {constraint};\n'
              marker = f'ALTER TABLE {table}\n    ADD CONSTRAINT {constraint}'
              inline_marker = f'ALTER TABLE {table} ADD CONSTRAINT {constraint}'
              if drop not in migration:
                  if marker in migration:
                      migration = migration.replace(marker, drop + marker, 1)
                  elif inline_marker in migration:
                      migration = migration.replace(inline_marker, drop + inline_marker, 1)
                  else:
                      raise SystemExit(f'Constraint não encontrada: {constraint}')
          triggers = {
              'immutable_published_form_version': 'forms.form_versions',
              'immutable_published_blocks': 'forms.form_blocks',
              'immutable_published_fields': 'forms.form_fields',
              'immutable_published_calculations': 'forms.form_calculations',
              'immutable_published_validations': 'forms.form_validations',
              'immutable_published_visibility': 'forms.form_visibility_rules',
          }
          for trigger, table in triggers.items():
              marker = f'CREATE TRIGGER {trigger}'
              drop = f'DROP TRIGGER IF EXISTS {trigger} ON {table};\n'
              if drop not in migration:
                  if marker not in migration:
                      raise SystemExit(f'Trigger não encontrado: {trigger}')
                  migration = migration.replace(marker, drop + marker, 1)
          migration_path.write_text(migration, encoding='utf-8', newline='\n')

          dynamic_test_path = root / 'tests/test_dynamic_forms_migration.py'
          dynamic_test = dynamic_test_path.read_text(encoding='utf-8')
          dynamic_test = dynamic_test.replace(
              'assert f"CREATE TABLE forms.{table}" in source',
              'assert f"CREATE TABLE IF NOT EXISTS forms.{table}" in source',
          )
          dynamic_test_path.write_text(dynamic_test, encoding='utf-8', newline='\n')

          alerts_test_path = root / 'tests/test_outbox_alerts.py'
          alerts_test = alerts_test_path.read_text(encoding='utf-8')
          start = alerts_test.index('def test_outbox_dashboard_covers_all_exported_operational_metrics() -> None:\n')
          replacement = '''def test_outbox_dashboard_covers_all_exported_operational_metrics() -> None:
              dashboard = load_dashboard()
              panels = dashboard["panels"]
              expressions = " ".join(
                  target.get("expr", "")
                  for panel in panels
                  for target in panel.get("targets", [])
              )

              assert dashboard["uid"] == "outbox-dispatcher"
              assert len(panels) >= 6
              assert "all_in_one_outbox_pending" in expressions
              assert "all_in_one_outbox_due" in expressions
              assert "all_in_one_outbox_published_total" in expressions
              assert "all_in_one_outbox_failed_retryable_total" in expressions
              assert "all_in_one_outbox_max_retry_count" in expressions
              assert "all_in_one_outbox_oldest_pending_age_seconds" in expressions
          '''
          alerts_test_path.write_text(alerts_test[:start] + replacement, encoding='utf-8', newline='\n')

          security_path = root / '.github/workflows/security.yml'
          security = security_path.read_text(encoding='utf-8')
          matrix_ref = '$' + '{{ matrix.app }}'
          old_audit = (
              '      - run: npm audit --omit=dev --audit-level=critical\n'
              f'        working-directory: {matrix_ref}\n'
          )
          new_audit = (
              '      - name: Auditar dependências JavaScript\n'
              f'        working-directory: {matrix_ref}\n'
              '        shell: bash\n'
              '        run: |\n'
              '          set -euo pipefail\n'
              '          for attempt in 1 2 3; do\n'
              '            set +e\n'
              '            output="$(npm audit --omit=dev --audit-level=critical 2>&1)"\n'
              '            status=$?\n'
              '            set -e\n'
              '            printf \'%s\\n\' "$output"\n'
              '            if [ "$status" -eq 0 ]; then exit 0; fi\n'
              '            if printf \'%s\' "$output" | grep -Eq \'audit endpoint returned an error|invalid json response body\'; then\n'
              '              echo "Registro npm retornou resposta inválida; repetindo auditoria (${attempt}/3)."\n'
              '              continue\n'
              '            fi\n'
              '            exit "$status"\n'
              '          done\n'
              '          echo "Registro npm permaneceu indisponível após três tentativas."\n'
              '          exit 1\n'
          )
          if old_audit in security:
              security = security.replace(old_audit, new_audit, 1)
          elif 'name: Auditar dependências JavaScript' not in security:
              raise SystemExit('Etapa npm audit não localizada estruturalmente.')
          security_path.write_text(security, encoding='utf-8', newline='\n')

          (root / '.github/workflows/diagnose_jobs_postgres.yml').unlink(missing_ok=True)

          canonical = textwrap.dedent('''\
          name: Refresh Generated Contracts

          on:
            workflow_dispatch:

          permissions:
            contents: write

          jobs:
            refresh:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - name: Regenerar contratos e artefatos controlados
                  run: |
                    python scripts/scaffold_modules.py
                    python scripts/generate_domain_event_fixtures.py
                    python scripts/generate_data_audit_inventory.py
                - name: Validar alterações geradas
                  run: |
                    python scripts/scaffold_modules.py --check
                    python scripts/generate_domain_event_fixtures.py --check
                    python scripts/validate_openapi.py
                    python scripts/validate_repository.py
                - name: Versionar somente alterações geradas
                  run: |
                    git config user.name "all-in-one-bot"
                    git config user.email "actions@users.noreply.github.com"
                    git add apps modules contracts config docs/data-audit
                    git diff --cached --check
                    git diff --cached --quiet || git commit -m "chore: atualizar contratos e artefatos gerados"
                    git push
          ''')
          (root / '.github/workflows/autocommit.yml').write_text(canonical, encoding='utf-8', newline='\n')
          PY
      - name: Validar testes e migrações
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_outbox_alerts.py tests/test_dynamic_forms_migration.py tests/test_security_gates.py
          for file in database/postgres/migrations/*.sql; do
            psql -h localhost -U all_in_one -d all_in_one -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          python scripts/validate_postgres_real_dsn.py --repeat-migrations --write-checks
          env -u ALL_IN_ONE_POSTGRES_MATRIX_DSN python -m pytest -q --ignore=tests/e2e
      - name: Validar auditorias npm
        shell: bash
        run: |
          set -euo pipefail
          audit_app() {
            local app="$1"
            cd "$app"
            for attempt in 1 2 3; do
              set +e
              output="$(npm audit --omit=dev --audit-level=critical 2>&1)"
              status=$?
              set -e
              printf '%s\n' "$output"
              if [ "$status" -eq 0 ]; then cd - >/dev/null; return 0; fi
              if printf '%s' "$output" | grep -Eq 'audit endpoint returned an error|invalid json response body'; then continue; fi
              cd - >/dev/null
              return "$status"
            done
            cd - >/dev/null
            return 1
          }
          audit_app apps/all-in-one
          audit_app apps/all-in-one-business
      - name: Versionar correções validadas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet || git commit -m "fix: concluir validação residual do PR 34"
          git push origin HEAD:${{ github.head_ref }}
