name: Refresh Generated Contracts

on:
  workflow_dispatch:
  push:
    branches:
      - fix/generated-artifacts-gate
    paths:
      - ".github/workflows/autocommit.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref_name == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capturar falhas do contrato Android
        shell: bash
        run: |
          mkdir -p reports/ci
          set +e
          python scripts/validate_valley_android_release.py > reports/ci/valley-android-release-diagnostic.txt 2>&1
          cat reports/ci/valley-android-release-diagnostic.txt
          exit 0
      - name: Commit diagnostic report
        run: |
          git config user.name "all-in-one-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ci/valley-android-release-diagnostic.txt
          git diff --cached --quiet || git commit -m "ci: registrar diagnostico do contrato Android Valley"
          git push
