name: Limpar migração Vision e corrigir gerador

on:
  push:
    branches:
      - codex/remover-vision-atualizar-stock-2026-07-25
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message || '', '[vision-cleanup-final]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: codex/remover-vision-atualizar-stock-2026-07-25
          fetch-depth: 0

      - name: Corrigir gerador e remover arquivos temporários
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/scaffold_modules.py')
          text = path.read_text(encoding='utf-8')

          readme_bug = '''        special = dedent(
              """\\
              `streams` guarda somente metadados privados e hash da URL;
              `recordings` preserva hash/storage append-only; `motion_alerts`
              registra deteccoes e incidentes auditaveis.
              """
          )
          rendered = rendered.replace(
              f"{entities}.\\n\\n## Execucao",
              f"{entities}.\\n\\n{special}\\n## Execucao",
          )
'''
          text = text.replace(readme_bug, '')

          contract_bug = '''        special += dedent(
              """

              ## Stream, gravacao e alerta operacional

              """
          )
'''
          text = text.replace(contract_bug, '')

          path.write_text(text, encoding='utf-8')
          PY

          rm -f scripts/remove_vision_update_stock.py
          rm -f .github/workflows/regenerate-artifacts-24-modules.yml

      - name: Gravar limpeza
        run: |
          BRANCH="codex/remover-vision-atualizar-stock-2026-07-25"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: limpar migração e corrigir gerador [vision-cleanup-final]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
