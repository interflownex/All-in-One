name: Regenerar artefatos para 24 módulos

on:
  push:
    branches:
      - codex/remover-vision-atualizar-stock-2026-07-25
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message || '', '[artifacts-24-regenerated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: codex/remover-vision-atualizar-stock-2026-07-25
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -e .

      - name: Regenerar módulos e contratos
        run: python scripts/scaffold_modules.py

      - name: Regenerar catálogo de eventos
        run: python scripts/generate_domain_event_fixtures.py

      - name: Validar OpenAPI
        run: python scripts/validate_openapi.py

      - name: Validar repositório
        run: python scripts/validate_repository.py

      - name: Gravar artefatos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Artefatos já estão atualizados."
            exit 0
          fi
          git commit -m "chore: regenerar artefatos para 24 módulos [artifacts-24-regenerated]"
          git push origin HEAD:codex/remover-vision-atualizar-stock-2026-07-25
