name: Docker Compose Health Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compose-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose services and HTTP healthchecks
        run: python3 scripts/validate_compose_health.py --down-after --timeout-seconds 300
