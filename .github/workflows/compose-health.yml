name: Docker Compose Health Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose services and HTTP healthchecks
        run: python3 scripts/validate_compose_health.py --env-file .env.docker-dx --project-name all-in-one-dx --require-free-ports --down-after --command-timeout-seconds 900 --timeout-seconds 600 --probe-timeout-seconds 1
