name: Mayhem for API

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 3"
  push:
    branches: [main]
    paths:
      - "**/openapi*.json"
      - "**/openapi*.yaml"
      - "**/openapi*.yml"
      - ".github/workflows/mayhem-for-api.yml"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  mayhem-for-api:
    name: Mayhem API security scan
    if: ${{ vars.ENABLE_MAYHEM == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate Mayhem configuration
        env:
          MAYHEM_TOKEN: ${{ secrets.MAYHEM_TOKEN }}
          MAYHEM_API_URL: ${{ vars.MAYHEM_API_URL }}
          MAYHEM_API_SPEC: ${{ vars.MAYHEM_API_SPEC }}
        run: |
          test -n "$MAYHEM_TOKEN"
          test -n "$MAYHEM_API_URL"
          test -n "$MAYHEM_API_SPEC"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Mayhem for API
        uses: ForAllSecure/mapi-action@v1
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          api-url: ${{ vars.MAYHEM_API_URL }}
          api-spec: ${{ vars.MAYHEM_API_SPEC }}
          duration: 60
          sarif-report: mapi.sarif

      - name: Upload SARIF report
        if: ${{ always() && hashFiles('mapi.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: mapi.sarif
