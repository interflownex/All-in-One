name: Diagnose Finance PostgreSQL

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose_jobs_postgres.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: all_in_one
          POSTGRES_USER: all_in_one
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U all_in_one -d all_in_one"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: test-password
      ALL_IN_ONE_POSTGRES_MATRIX_DSN: postgresql://all_in_one:test-password@localhost:5432/all_in_one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt >/dev/null
      - name: Aplicar migrações
        run: |
          for file in database/postgres/migrations/*.sql; do
            psql -h localhost -U all_in_one -d all_in_one -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
      - name: Capturar falha isolada de Finance
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_postgres_priority_stores_integration.py::test_finance_wallet_create_get_list_and_outbox -q --tb=short --maxfail=1 > finance-postgres-diagnostic.txt 2>&1
          echo "exit_code=$?" >> finance-postgres-diagnostic.txt
          cat finance-postgres-diagnostic.txt
          exit 0
      - name: Publicar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: finance-postgres-diagnostic-${{ github.run_id }}
          path: finance-postgres-diagnostic.txt
          if-no-files-found: error
          retention-days: 2
