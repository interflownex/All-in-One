name: V2.9 Fix Android Contract Marker

on:
  push:
    branches:
      - fix/cicd-governanca-v2-8-2026-07-27
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-contract:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[v29-android-contract-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v6
        with:
          ref: fix/cicd-governanca-v2-8-2026-07-27
          fetch-depth: 0

      - name: Replace only the obsolete Android task marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_valley_android_release.py')
          text = path.read_text(encoding='utf-8')
          old = '        "testDebugUnitTest lintDebug assembleDebug",'
          new = '        "testProductionDebugUnitTest lintProductionDebug assembleProductionDebug",'

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Marcador Android esperado não foi encontrado no validador.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add regression test
        shell: bash
        run: |
          cat > tests/test_valley_android_workflow_contract.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SECURITY_WORKFLOW = ROOT / '.github' / 'workflows' / 'security.yml'
          VALIDATOR = ROOT / 'scripts' / 'validate_valley_android_release.py'


          def test_android_security_contract_uses_explicit_production_debug_tasks() -> None:
              workflow = SECURITY_WORKFLOW.read_text(encoding='utf-8')
              validator = VALIDATOR.read_text(encoding='utf-8')
              explicit = (
                  'testProductionDebugUnitTest '
                  'lintProductionDebug '
                  'assembleProductionDebug'
              )
              obsolete = 'testDebugUnitTest lintDebug assembleDebug'

              assert explicit in workflow
              assert explicit in validator
              assert obsolete not in validator
          PY

      - name: Validate exact patch
        shell: bash
        run: |
          python -m py_compile scripts/validate_valley_android_release.py
          python scripts/validate_valley_android_release.py
          python -m pytest -q tests/test_valley_android_workflow_contract.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' scripts/validate_valley_android_release.py tests/test_valley_android_workflow_contract.py | sort)"
          test "$changed" = "$expected"

      - name: Commit validated correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Contrato Android já estava atualizado.'
            exit 0
          fi
          git config user.name 'all-in-one-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/validate_valley_android_release.py tests/test_valley_android_workflow_contract.py
          git commit -m 'fix(android): alinhar contrato às tarefas productionDebug [v29-android-contract-fix]'
          git push origin HEAD:fix/cicd-governanca-v2-8-2026-07-27
