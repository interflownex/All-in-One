name: Firebase Valley App Distribution

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Notas desta versão de teste"
        required: false
        default: "Build automatizado do Valley"
  push:
    tags:
      - "valley-consumer-v*"

permissions:
  contents: read

concurrency:
  group: firebase-valley-app-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-distribute:
    name: Build and distribute Valley APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: firebase-valley-testing

    defaults:
      run:
        working-directory: apps/valley-flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Validate generated APK
        run: |
          set -euo pipefail
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK as GitHub artifact
        uses: actions/upload-artifact@v6
        with:
          name: valley-consumer-apk-${{ github.sha }}
          path: apps/valley-flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create temporary Firebase credentials file
        id: firebase_credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SECRETS_VALLEY }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON}"
          credentials_file="${RUNNER_TEMP}/firebase-valley-service-account.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${credentials_file}"
          chmod 600 "${credentials_file}"
          echo "credentials_file=${credentials_file}" >> "${GITHUB_OUTPUT}"

      - name: Validate Android Firebase App ID
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_VALLEY_ANDROID }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_APP_ID}"
          case "${FIREBASE_APP_ID}" in
            1:540882936740:android:*) ;;
            *) echo "Firebase Android App ID não pertence ao projeto Valley esperado." >&2; exit 1 ;;
          esac

      - name: Install Firebase CLI
        shell: bash
        run: npm install --global firebase-tools

      - name: Distribute APK to Firebase App Distribution
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.firebase_credentials.outputs.credentials_file }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_VALLEY_ANDROID }}
          FIREBASE_TESTERS: ${{ vars.FIREBASE_VALLEY_TESTERS }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_VALLEY_TESTER_GROUPS }}
          RELEASE_NOTES: ${{ inputs.release_notes || format('Valley build {0}', github.sha) }}
        run: |
          set -euo pipefail

          args=(
            appdistribution:distribute
            build/app/outputs/flutter-apk/app-release.apk
            --app "${FIREBASE_APP_ID}"
            --release-notes "${RELEASE_NOTES}"
          )

          if [ -n "${FIREBASE_TESTERS:-}" ]; then
            args+=(--testers "${FIREBASE_TESTERS}")
          fi

          if [ -n "${FIREBASE_TESTER_GROUPS:-}" ]; then
            args+=(--groups "${FIREBASE_TESTER_GROUPS}")
          fi

          if [ -z "${FIREBASE_TESTERS:-}" ] && [ -z "${FIREBASE_TESTER_GROUPS:-}" ]; then
            echo "Defina FIREBASE_VALLEY_TESTERS ou FIREBASE_VALLEY_TESTER_GROUPS." >&2
            exit 1
          fi

          firebase "${args[@]}"

      - name: Remove temporary Firebase credentials
        if: always()
        shell: bash
        run: rm -f "${{ steps.firebase_credentials.outputs.credentials_file }}"
