name: Diagnose Android Residual Failure

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose_residual.yml"

permissions:
  contents: read

jobs:
  valley-android:
    if: github.head_ref == 'fix/generated-artifacts-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Capturar falha Android em arquivo reduzido
        shell: bash
        run: |
          set +e
          full_log="$RUNNER_TEMP/android-full.log"
          python scripts/validate_valley_android_release.py > "$full_log" 2>&1
          validate_status=$?
          gradle_status=0
          if [ "$validate_status" -eq 0 ]; then
            apps/valley-android/gradlew -p apps/valley-android \
              testStagingDebugUnitTest lintStagingDebug assembleStagingDebug \
              --no-daemon --stacktrace >> "$full_log" 2>&1
            gradle_status=$?
          fi
          tail -n 500 "$full_log" > android-residual-diagnostic.txt
          {
            echo
            echo "validate_exit=$validate_status"
            echo "gradle_exit=$gradle_status"
          } >> android-residual-diagnostic.txt
          cat android-residual-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: android-residual-diagnostic-${{ github.run_id }}
          path: android-residual-diagnostic.txt
          if-no-files-found: error
          retention-days: 2
