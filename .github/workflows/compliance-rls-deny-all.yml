name: Compliance RLS Deny-All F0.3

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "database/postgres/migrations/036_compliance_rls_deny_all_baseline.sql"
      - "database/postgres/rollbacks/036_compliance_rls_deny_all_baseline.sql"
      - "tests/test_compliance_rls_deny_all_baseline_migration.py"
      - "scripts/compliance/check_rls_deny_all_runtime.sh"
      - ".github/workflows/compliance-rls-deny-all.yml"
  push:
    branches: [main]
    paths:
      - "database/postgres/migrations/036_compliance_rls_deny_all_baseline.sql"
      - "database/postgres/rollbacks/036_compliance_rls_deny_all_baseline.sql"
      - "tests/test_compliance_rls_deny_all_baseline_migration.py"
      - "scripts/compliance/check_rls_deny_all_runtime.sh"
      - ".github/workflows/compliance-rls-deny-all.yml"

permissions:
  contents: read

jobs:
  rls-deny-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: all_in_one
          POSTGRES_USER: all_in_one
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U all_in_one -d all_in_one"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: local-ci-only
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: all_in_one
      PGUSER: all_in_one

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply PostgreSQL foundation through RLS baseline
        run: |
          for file in database/postgres/migrations/*.sql; do
            psql -X -h localhost -U all_in_one -d all_in_one \
              -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Prove fail-closed RLS, rollback and reapply
        run: bash scripts/compliance/check_rls_deny_all_runtime.sh
