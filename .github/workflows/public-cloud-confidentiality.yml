name: Public Confidentiality Boundary

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-operational-cloud-material:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject sensitive paths and secret material
        shell: bash
        run: |
          set -euo pipefail
          violations=0

          while IFS= read -r path; do
            case "$path" in
              .env|.env.*|*/.env|*/.env.*|*.pem|*.key|*.p12|*.pfx|*.jks|*.keystore|*credentials*.json|*service-account*.json|*service_account*.json|google-services.json|*/google-services.json|GoogleService-Info.plist|*/GoogleService-Info.plist|*.tfstate|*.tfstate.*|private/*|*/private/*|internal/*|*/internal/*|secrets/*|*/secrets/*|config/cloud/*|*/config/cloud/*|.firebaserc|*/.firebaserc|firebase.json|*/firebase.json)
                if [[ "$path" != ".env.example" && "$path" != */.env.example ]]; then
                  echo "::error file=$path::Material sensível, operacional ou privado não pode existir no repositório público."
                  violations=1
                fi
                ;;
            esac
          done < <(git ls-files)

          patterns='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|"private_key"[[:space:]]*:|"client_secret"[[:space:]]*:|"client_email"[[:space:]]*:|password[[:space:]]*[:=][[:space:]]*"[^"]{8,}"|token[[:space:]]*[:=][[:space:]]*"[A-Za-z0-9._-]{16,}"|\.iam\.gserviceaccount\.com|projects/[a-z][a-z0-9-]{4,28}[a-z0-9]'

          if git grep -nI -E "$patterns" -- . \
            ':!.github/workflows/public-cloud-confidentiality.yml' \
            ':!SECURITY.md' \
            >/tmp/public-confidentiality.txt 2>/dev/null; then
            cat /tmp/public-confidentiality.txt
            echo "::error::Possível segredo, credencial, identificador operacional ou chave detectado. Publique somente placeholders neutros."
            violations=1
          fi

          test "$violations" -eq 0

      - name: Enforce workflow least privilege and immutable actions
        shell: bash
        run: |
          set -euo pipefail
          violations=0

          if [[ ! -f .github/CODEOWNERS ]]; then
            echo "::error file=.github/CODEOWNERS::CODEOWNERS é obrigatório para superfícies sensíveis."
            violations=1
          fi

          forbidden_trigger='pull_request''_target:'

          while IFS= read -r workflow; do
            if grep -nF "$forbidden_trigger" "$workflow"; then
              echo "::error file=$workflow::Trigger privilegiado de pull request não é permitido no repositório público."
              violations=1
            fi

            if grep -nE 'permissions:[[:space:]]*write-all|^[[:space:]]+[A-Za-z0-9_-]+:[[:space:]]*write([[:space:]]*#.*)?$' "$workflow"; then
              echo "::error file=$workflow::Workflow público deve operar sem permissões de escrita."
              violations=1
            fi

            if grep -nE '\$\{\{[[:space:]]*secrets\.|secrets\.[A-Za-z0-9_]+' "$workflow"; then
              echo "::error file=$workflow::Workflow público não deve depender de secrets do repositório."
              violations=1
            fi

            if grep -nE 'persist-credentials:[[:space:]]*true' "$workflow"; then
              echo "::error file=$workflow::Checkout não pode persistir credenciais."
              violations=1
            fi

            while IFS= read -r uses_line; do
              uses_ref=$(printf '%s\n' "$uses_line" | sed -E 's/^[[:space:]-]*uses:[[:space:]]*([^[:space:]#]+).*/\1/')
              case "$uses_ref" in
                ./*|docker://*)
                  continue
                  ;;
              esac

              if [[ "$uses_ref" != *@* ]]; then
                echo "::error file=$workflow::Action sem referência imutável: $uses_ref"
                violations=1
                continue
              fi

              ref="${uses_ref##*@}"
              if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error file=$workflow::Action deve estar fixada por SHA completo: $uses_ref"
                violations=1
              fi
            done < <(grep -E '^[[:space:]-]*uses:[[:space:]]*' "$workflow" || true)
          done < <(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml')

          test "$violations" -eq 0
