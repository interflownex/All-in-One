name: Temporary Cryptography 50 Source Sync

on:
  push:
    branches:
      - chore/security-cryptography-50-source-sync
    paths:
      - .github/workflows/_temporary-sync-cryptography-50.yml

permissions:
  contents: write

concurrency:
  group: temporary-cryptography-50-source-sync
  cancel-in-progress: false

jobs:
  sync-source-and-generated-requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v6
        with:
          ref: chore/security-cryptography-50-source-sync
          fetch-depth: 0

      - name: Atualizar fonte de verdade e artefatos derivados
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = "cryptography==48.0.1"
          new = "cryptography==50.0.0"
          expected = {
              Path("pyproject.toml"): 1,
              Path("scripts/scaffold_modules.py"): 2,
              Path("modules/jobs/requirements.txt"): 1,
              Path("modules/api_hub/requirements.txt"): 1,
          }
          for path, expected_count in expected.items():
              text = path.read_text(encoding="utf-8")
              actual_count = text.count(old)
              if actual_count != expected_count:
                  raise SystemExit(
                      f"{path}: esperado {expected_count} marcador(es), encontrado(s) {actual_count}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")
          for path in expected:
              text = path.read_text(encoding="utf-8")
              if old in text or new not in text:
                  raise SystemExit(f"{path}: sincronização inválida")
          PY
          python scripts/check_scaffold_modules.py --check

      - name: Remover automação temporária e publicar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary-sync-cryptography-50.yml
          git add pyproject.toml scripts/scaffold_modules.py \
            modules/jobs/requirements.txt modules/api_hub/requirements.txt
          git diff --cached --check
          git commit -m "fix(security): sincronizar cryptography 50.0.0"
          git push origin HEAD:chore/security-cryptography-50-source-sync
