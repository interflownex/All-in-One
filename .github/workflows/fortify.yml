name: Fortify AST Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 4"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.java"
      - "**/*.kt"
      - "**/requirements*.txt"
      - "**/package-lock.json"
      - ".github/workflows/fortify.yml"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  fortify-ast-scan:
    name: Fortify AST Scan
    if: ${{ vars.ENABLE_FORTIFY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate Fortify authentication
        env:
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PASSWORD: ${{ secrets.FOD_PAT }}
        run: |
          if [[ -n "$FOD_CLIENT_ID" && -n "$FOD_CLIENT_SECRET" ]]; then
            exit 0
          fi
          if [[ -n "$FOD_TENANT" && -n "$FOD_USER" && -n "$FOD_PASSWORD" ]]; then
            exit 0
          fi
          echo "Fortify habilitado sem credenciais completas." >&2
          exit 1

      - name: Check out source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Fortify scan
        uses: fortify/github-action@ef5539bf4bd9c45c0bd971978f635a69eae55297
        with:
          sast-scan: true
          debricked-sca-scan: false
        env:
          FOD_URL: ${{ vars.FOD_URL || 'https://ams.fortify.com' }}
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PASSWORD: ${{ secrets.FOD_PAT }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
          DO_WAIT: true
          DO_POLICY_CHECK: true
          DO_JOB_SUMMARY: true
          DO_EXPORT: true
