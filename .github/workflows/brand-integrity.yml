name: Integridade das marcas oficiais

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "assets/brand/**"
      - "config/branding/**"
      - "config/autonomy/multi_agent_sync_policy.json"
      - "apps/**"
      - "desktop/**"
      - "frontend/**"
      - "scripts/check_brand_integrity.py"
      - "tests/test_branding_assets.py"
      - ".github/workflows/brand-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brand-integrity-main
  cancel-in-progress: false

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar executor de testes
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.4.2"

      - name: Restaurar aliases conhecidos
        run: python3 scripts/check_brand_integrity.py --fix

      - name: Validar contrato e ativos
        run: |
          python3 scripts/check_brand_integrity.py
          python3 -m pytest tests/test_branding_assets.py -q

      - name: Registrar remediação automática
        if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma referência de marca precisou ser corrigida."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(branding): restaurar referências aos ativos oficiais"
          git push origin HEAD:main

      - name: Confirmar árvore limpa após remediação
        run: |
          python3 scripts/check_brand_integrity.py
          git diff --check
