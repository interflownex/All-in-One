name: Valley Android Security

on:
  pull_request:
    paths:
      - "apps/valley-android/**"
      - ".github/workflows/valley-android-security.yml"
  push:
    branches: [main]
    paths:
      - "apps/valley-android/**"
      - ".github/workflows/valley-android-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valley-android-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-security-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/valley-android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Garantir Gradle Wrapper executável
        run: chmod +x ./gradlew
      - name: Bloquear chave debug em release
        run: |
          if grep -R --line-number --exclude-dir=build -E 'signingConfig.*debug|debug\.keystore' app; then
            echo 'Release não pode usar chave de depuração.' >&2
            exit 1
          fi
      - name: Verificar manifesto seguro
        run: |
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
      - name: Testes unitários da variante homologável
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/valley-pr-unit"
          ./gradlew testProductionDebugUnitTest --no-daemon --stacktrace \
            > "$RUNNER_TEMP/valley-pr-unit/gradle-unit.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/valley-pr-unit/gradle-unit.rc"
          cat "$RUNNER_TEMP/valley-pr-unit/gradle-unit.log"
          exit "$rc"
      - name: Publicar evidência dos testes Android
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: valley-pr-unit-diagnostic
          path: |
            ${{ runner.temp }}/valley-pr-unit
            apps/valley-android/app/build/test-results
            apps/valley-android/app/build/reports/tests
          if-no-files-found: warn
          retention-days: 7
      - name: Montar APK homologável sem segredos de produção
        run: ./gradlew assembleProductionDebug --no-daemon --stacktrace
      - name: Gerar evidência de dependências Gradle
        run: ./gradlew dependencies > valley-gradle-dependencies.txt
      - uses: actions/upload-artifact@v5
        with:
          name: valley-pr-security-evidence
          path: |
            apps/valley-android/valley-gradle-dependencies.txt
            apps/valley-android/app/build/outputs/apk/production/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  main-security-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/valley-android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Garantir Gradle Wrapper executável
        run: chmod +x ./gradlew
      - name: Validar contrato Android
        run: python ../../scripts/validate_valley_android_release.py
      - name: Testar e montar homologação na main
        run: |
          ./gradlew testProductionDebugUnitTest --no-daemon --stacktrace
          ./gradlew lintProductionDebug --no-daemon --stacktrace
          ./gradlew assembleProductionDebug --no-daemon --stacktrace
      - name: Gerar evidência de dependências Gradle
        run: ./gradlew dependencies > valley-gradle-dependencies.txt
      - uses: actions/upload-artifact@v5
        with:
          name: valley-main-security-evidence
          path: |
            apps/valley-android/valley-gradle-dependencies.txt
            apps/valley-android/app/build/outputs/apk/production/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  production-release-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/valley-android
    env:
      VALLEY_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.VALLEY_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
      VALLEY_PLAY_APP_SIGNING_CERT_SHA256: ${{ secrets.VALLEY_PLAY_APP_SIGNING_CERT_SHA256 }}
      VALLEY_API_HUB_PINNED_SPKI_SHA256: ${{ secrets.VALLEY_API_HUB_PINNED_SPKI_SHA256 }}
      VALLEY_KEYSTORE_BASE64: ${{ secrets.VALLEY_KEYSTORE_BASE64 }}
      VALLEY_KEYSTORE_PASSWORD: ${{ secrets.VALLEY_KEYSTORE_PASSWORD }}
      VALLEY_KEY_ALIAS: ${{ secrets.VALLEY_KEY_ALIAS }}
      VALLEY_KEY_PASSWORD: ${{ secrets.VALLEY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Garantir Gradle Wrapper executável
        run: chmod +x ./gradlew
      - name: Exigir segredos de produção
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VALLEY_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER
            VALLEY_PLAY_APP_SIGNING_CERT_SHA256
            VALLEY_API_HUB_PINNED_SPKI_SHA256
            VALLEY_KEYSTORE_BASE64
            VALLEY_KEYSTORE_PASSWORD
            VALLEY_KEY_ALIAS
            VALLEY_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Segredo obrigatório ausente: $name" >&2
              exit 1
            fi
          done
      - name: Preparar assinatura efêmera
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/valley-release.keystore"
          properties="$RUNNER_TEMP/valley-release.properties"
          printf '%s' "$VALLEY_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > "$properties" <<EOF
          storeFile=$keystore
          storePassword=$VALLEY_KEYSTORE_PASSWORD
          keyAlias=$VALLEY_KEY_ALIAS
          keyPassword=$VALLEY_KEY_PASSWORD
          EOF
          echo "VALLEY_RELEASE_SIGNING_PROPERTIES=$properties" >> "$GITHUB_ENV"
      - name: Testar release de produção
        run: ./gradlew testProductionReleaseUnitTest --no-daemon --stacktrace
      - name: Gerar release assinada e endurecida
        run: ./gradlew bundleProductionRelease assembleProductionRelease --no-daemon --stacktrace
      - name: Gerar evidência de dependências Gradle
        run: ./gradlew dependencies > valley-gradle-dependencies.txt
      - uses: actions/upload-artifact@v5
        with:
          name: valley-production-release-evidence
          path: |
            apps/valley-android/valley-gradle-dependencies.txt
            apps/valley-android/app/build/outputs/apk/production/release/*.apk
            apps/valley-android/app/build/outputs/bundle/productionRelease/*.aab
          if-no-files-found: error
          retention-days: 30
