name: Valley Android Security

on:
  pull_request:
    paths:
      - "apps/valley-android/**"
      - ".github/workflows/valley-android-security.yml"
  push:
    branches: [main]
    paths:
      - "apps/valley-android/**"

permissions:
  contents: read

jobs:
  android-security-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/valley-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Bloquear chave debug em release
        run: |
          if grep -R --line-number --exclude-dir=build -E 'signingConfig.*debug|debug\.keystore' app; then
            echo 'Release não pode usar chave de depuração.' >&2
            exit 1
          fi
      - name: Verificar manifesto seguro
        run: |
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
      - name: Testes unitários reproduzíveis
        run: ./gradlew testProductionDebugUnitTest --no-daemon --stacktrace
      - name: Validar montagem de variante sem credenciais de produção
        run: ./gradlew assembleProductionDebug --no-daemon --stacktrace
      - name: Gerar SBOM de dependências Gradle
        run: ./gradlew dependencies > valley-gradle-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: valley-security-evidence
          path: |
            apps/valley-android/valley-gradle-dependencies.txt
            apps/valley-android/app/build/outputs/apk/production/debug/*.apk
