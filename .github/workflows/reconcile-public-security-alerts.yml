name: Reconciliar alertas históricos do repositório público

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reconcile-public-security-alerts.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reconcile-public-security-alerts.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: reconcile-public-security-alerts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconciliar ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - java-kotlin
          - javascript-typescript
          - python
          - rust

    steps:
      - name: Gerar SARIF vazio para árvore documental
        shell: bash
        env:
          LANGUAGE_CATEGORY: ${{ matrix.language }}
        run: |
          set -euo pipefail
          mkdir -p sarif
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          language = os.environ["LANGUAGE_CATEGORY"]
          payload = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "All-in-One public README reconciliation",
                              "informationUri": "https://github.com/interflownex/All-in-One",
                              "rules": [],
                              "version": "1.0.0",
                          }
                      },
                      "results": [],
                      "properties": {
                          "repositoryPurpose": "public-documentation-only",
                          "historicalLanguageCategory": language,
                      },
                  }
              ],
          }
          target = Path("sarif") / f"{language}.sarif"
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          print(target)
          PY

      - name: Publicar reconciliação no Code Scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: sarif/${{ matrix.language }}.sarif
          category: /language:${{ matrix.language }}
