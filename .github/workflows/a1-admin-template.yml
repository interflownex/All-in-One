name: A1 Admin Template

on:
  pull_request:
    paths:
      - "apps/all-in-one-admin/**"
      - "apps/valley-android/admin/**"
      - ".github/workflows/a1-admin-template.yml"
  push:
    branches: [main]
    paths:
      - "apps/all-in-one-admin/**"
      - "apps/valley-android/admin/**"
      - ".github/workflows/a1-admin-template.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/all-in-one-admin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Instalar dependências de forma determinística
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-fund --no-audit
          else
            npm install --package-lock-only --ignore-scripts --no-fund --no-audit
            npm ci --no-fund --no-audit
          fi
      - name: Validar design, lint e build
        run: npm run check
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=critical
      - name: Versionar lockfile gerado na branch da PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          git add apps/all-in-one-admin/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(admin): versionar lockfile gerado"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Publicar lockfile como evidência
        uses: actions/upload-artifact@v5
        with:
          name: a1-admin-package-lock
          path: apps/all-in-one-admin/package-lock.json
          if-no-files-found: error
          retention-days: 7

  android-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Garantir Gradle Wrapper executável
        run: chmod +x apps/valley-android/gradlew
      - name: Testar, analisar e empacotar A1 Admin
        run: >-
          apps/valley-android/gradlew -p apps/valley-android
          :admin:testDebugUnitTest :admin:lintDebug :admin:assembleDebug
          --no-daemon --stacktrace
