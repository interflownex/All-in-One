name: A1 Admin Template

on:
  pull_request:
    paths:
      - "apps/all-in-one-admin/**"
      - "apps/valley-android/admin/**"
      - ".github/workflows/a1-admin-template.yml"
      - "tarefas.md"
      - "docs/relatorios/pendencias/*v3.5_2026-07-28.md"
  push:
    branches: [main]
    paths:
      - "apps/all-in-one-admin/**"
      - "apps/valley-android/admin/**"
      - ".github/workflows/a1-admin-template.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/all-in-one-admin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/all-in-one-admin/package-lock.json
      - name: Instalar dependências bloqueadas
        run: npm ci --no-fund --no-audit
      - name: Validar design, lint e build
        run: npm run check
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=critical
      - name: Publicar lockfile como evidência
        uses: actions/upload-artifact@v5
        with:
          name: a1-admin-package-lock
          path: apps/all-in-one-admin/package-lock.json
          if-no-files-found: error
          retention-days: 7

  android-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Garantir Gradle Wrapper executável
        run: chmod +x apps/valley-android/gradlew
      - name: Testar, analisar e empacotar A1 Admin
        run: >-
          apps/valley-android/gradlew -p apps/valley-android
          :admin:testDebugUnitTest :admin:lintDebug :admin:assembleDebug
          --no-daemon --stacktrace
