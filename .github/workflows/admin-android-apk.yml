name: All in One Admin Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/admin-web-apk-delivery-2026-07-26
    paths:
      - "apps/valley-android/admin/**"
      - "apps/valley-android/settings.gradle.kts"
      - ".github/workflows/admin-android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/valley-android/admin/**"
      - "apps/valley-android/settings.gradle.kts"
      - ".github/workflows/admin-android-apk.yml"

permissions:
  contents: read

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validar e gerar APK Admin
        working-directory: apps/valley-android
        run: |
          chmod +x gradlew
          ./gradlew :admin:testDebugUnitTest :admin:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: all-in-one-admin-debug-apk
          if-no-files-found: error
          retention-days: 30
          path: apps/valley-android/admin/build/outputs/apk/debug/admin-debug.apk
