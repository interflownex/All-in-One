name: AIO Admin Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/aio-admin-android-total-*"
    paths:
      - "apps/valley-android/admin/**"
      - "apps/valley-android/settings.gradle.kts"
      - "assets/brand/aio-admin-logo-official.png"
      - ".github/workflows/admin-android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/valley-android/admin/**"
      - "apps/valley-android/settings.gradle.kts"
      - "assets/brand/aio-admin-logo-official.png"
      - ".github/workflows/admin-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: aio-admin-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Validar painel e backend publicados
        run: |
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 \
            https://9135635066da434181.v2.appdeploy.ai/ \
            --output /tmp/aio-admin.html
          test -s /tmp/aio-admin.html
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 \
            https://api-v2.appdeploy.ai/app/9135635066da434181/api/_healthcheck \
            --output /tmp/aio-admin-health.json
          grep -q 'Success' /tmp/aio-admin-health.json

      - name: Validar ativo oficial e ícones
        run: |
          test -s assets/brand/aio-admin-logo-official.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "apps/valley-android/admin/src/main/res/mipmap-${density}/ic_launcher.png"
          done

      - name: Testar, analisar e gerar APK Admin
        working-directory: apps/valley-android
        run: |
          chmod +x gradlew
          ./gradlew :admin:testDebugUnitTest :admin:lintDebug :admin:assembleDebug --no-daemon --stacktrace

      - name: Preparar instalador e checksum
        run: |
          cp apps/valley-android/admin/build/outputs/apk/debug/admin-debug.apk \
            AIO-Admin-2.0.0-debug.apk
          sha256sum AIO-Admin-2.0.0-debug.apk > AIO-Admin-2.0.0-debug.apk.sha256

      - name: Publicar APK para download
        uses: actions/upload-artifact@v7
        with:
          name: aio-admin-android-2.0.0-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            AIO-Admin-2.0.0-debug.apk
            AIO-Admin-2.0.0-debug.apk.sha256
