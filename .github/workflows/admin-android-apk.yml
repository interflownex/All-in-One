name: All in One Admin Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/admin-web-apk-delivery-2026-07-26
    paths:
      - "apps/valley-android/admin/**"
      - "apps/valley-android/settings.gradle.kts"
      - ".github/workflows/admin-android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/valley-android/admin/**"
      - "apps/valley-android/settings.gradle.kts"
      - ".github/workflows/admin-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: admin-android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Validar painel público
        run: |
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 \
            https://9135635066da434181.v2.appdeploy.ai/ \
            --output /tmp/all-in-one-admin.html
          test -s /tmp/all-in-one-admin.html

      - name: Testar e gerar APK Admin
        working-directory: apps/valley-android
        run: |
          chmod +x gradlew
          ./gradlew :admin:testDebugUnitTest :admin:assembleDebug --no-daemon --stacktrace

      - name: Preparar instalador e checksum
        run: |
          cp apps/valley-android/admin/build/outputs/apk/debug/admin-debug.apk \
            All-in-One-Admin-1.0.0.apk
          sha256sum All-in-One-Admin-1.0.0.apk > All-in-One-Admin-1.0.0.apk.sha256

      - name: Publicar APK para download
        uses: actions/upload-artifact@v5
        with:
          name: all-in-one-admin-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            All-in-One-Admin-1.0.0.apk
            All-in-One-Admin-1.0.0.apk.sha256
