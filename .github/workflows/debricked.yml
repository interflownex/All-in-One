name: Debricked Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"
  push:
    branches: [main]
    paths:
      - "**/package-lock.json"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/poetry.lock"
      - "**/gradle.lockfile"
      - ".github/workflows/debricked.yml"

permissions:
  contents: read

jobs:
  vulnerabilities-scan:
    name: Debricked vulnerability scan
    if: ${{ vars.ENABLE_DEBRICKED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate Debricked configuration
        env:
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}
        run: test -n "$DEBRICKED_TOKEN"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Debricked scan
        uses: debricked/actions@v4
        env:
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}
