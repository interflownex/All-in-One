name: Continuous Integration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture scaffold freshness
        id: scaffold
        shell: bash
        run: |
          set +e
          python scripts/scaffold_modules.py --check > scaffold-freshness.txt 2>&1
          status=$?
          cat scaffold-freshness.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload scaffold diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-freshness-${{ github.run_id }}
          path: scaffold-freshness.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce scaffold freshness
        if: steps.scaffold.outputs.exit_code != '0'
        run: |
          echo "Scaffold dessincronizado. Consulte o artefato scaffold-freshness-${{ github.run_id }}."
          exit 1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cleanup artifacts
        run: python scripts/cleanup_artifacts.py

      - name: Check generated artifacts
        run: python scripts/check_generated_artifacts.py

      - name: Validate Valley Android release contract
        run: python scripts/validate_valley_android_release.py

      - name: Test Valley APK audit rules
        run: python -m pytest -q tests/test_valley_android_signing.py tests/test_valley_apk_audit.py

      - name: Run Unit Tests
        run: python -m pytest -q --ignore=tests/e2e
