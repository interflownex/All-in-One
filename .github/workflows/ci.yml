name: Continuous Integration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cleanup artifacts
        run: python scripts/cleanup_artifacts.py

      - name: Check generated artifacts
        run: python scripts/check_generated_artifacts.py

      - name: Build F0.1 data inventory
        run: python scripts/compliance_inventory.py

      - name: Validate regulatory field catalog
        run: python scripts/validate_compliance_catalog.py

      - name: Validate Valley Android release contract
        run: python scripts/validate_valley_android_release_v29.py

      - name: Test Valley Android workflow contract
        run: python -m pytest -q tests/test_valley_android_workflow_contract.py

      - name: Test Valley APK audit rules
        run: python -m pytest -q tests/test_valley_android_signing.py tests/test_valley_apk_audit.py

      - name: Run Unit Tests
        run: python -m pytest -q --ignore=tests/e2e
