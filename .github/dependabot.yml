version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/apps/all-in-one"
    schedule: &npm_schedule
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Sao_Paulo"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels: &dependency_labels
      - "dependencies"
      - "security"
    groups: &npm_groups
      security-patches:
        applies-to: "security-updates"
        patterns:
          - "*"
      development-dependencies:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message: &npm_commit
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/apps/all-in-one-admin"
    schedule: *npm_schedule
    target-branch: "main"
    open-pull-requests-limit: 5
    labels: *dependency_labels
    groups: *npm_groups
    commit-message: *npm_commit

