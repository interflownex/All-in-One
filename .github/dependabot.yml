version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-actions)"

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/services/aio-mcp-gateway"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      python-security-patches:
        applies-to: "security-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps-python)"

  - package-ecosystem: "npm"
    directories:
      - "/apps/all-in-one"
      - "/apps/all-in-one-admin"
      - "/apps/all-in-one-business"
      - "/apps/all-in-one-health"
      - "/apps/all-in-one-mobility"
      - "/apps/all-in-one-riders"
      - "/apps/all-in-one-services"
      - "/apps/all-in-one-user"
      - "/apps/valley"
      - "/apps/valley_business"
      - "/apps/valley_rider"
      - "/desktop/valley-erp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    groups:
      npm-security-patches:
        applies-to: "security-updates"
        patterns:
          - "*"
      npm-development-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # typescript-eslint 8.65.0 aceita TypeScript abaixo de 6.1.0.
    # Evita PRs automaticamente quebrados até a toolchain declarar suporte ao 7.x.
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">= 7.0.0"
    commit-message:
      prefix: "chore(deps-npm)"

  - package-ecosystem: "gradle"
    directory: "/apps/valley-android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-android)"

  - package-ecosystem: "pub"
    directory: "/apps/valley-flutter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-flutter)"
