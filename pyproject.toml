[project]
name = "all-in-one"
version = "0.2.0"
description = "Bootstrap executavel do API Hub do ecossistema All-in-One + Valley"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.1",
    "starlette==1.3.1",
    "uvicorn[standard]==0.34.2",
    "httpx==0.28.1",
    "redis==8.1.0",
    "PyJWT==2.13.0",
    "psycopg[binary]==3.3.4",
    "tenacity==9.0.0",
    "cryptography==50.0.0",
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "PT",   # flake8-pytest-style
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
