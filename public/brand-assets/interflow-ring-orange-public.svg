<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">INTERFLOW</title><desc id="desc">Logomarca Interflow com anéis luminosos em laranja, roxo e azul sobre fundo transparente.</desc><defs><linearGradient id="ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb11b"/><stop offset=".16" stop-color="#ff7824"/><stop offset=".43" stop-color="#b61ee7"/><stop offset=".70" stop-color="#5427ff"/><stop offset="1" stop-color="#087bff"/></linearGradient><linearGradient id="ringHi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8bb"/><stop offset=".22" stop-color="#ffd450"/><stop offset=".52" stop-color="#ffefff"/><stop offset=".78" stop-color="#f7ebff"/><stop offset="1" stop-color="#d9f6ff"/></linearGradient><linearGradient id="textStroke" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b2"/><stop offset=".45" stop-color="#ffbe46"/><stop offset="1" stop-color="#ff7c18"/></linearGradient><filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20" result="b1"/><feColorMatrix in="b1" type="matrix" values="1 0 0 0 0.35 0 0.45 0 0 0.05 0 0 1 0 0.5 0 0 0 0.9 0" result="c1"/><feMerge><feMergeNode in="c1"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="textGlow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#ff8b16" flood-opacity=".8"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g transform="translate(768 512)"><circle r="411" fill="none" stroke="#2d0a37" stroke-width="76" opacity=".75"/><circle r="411" fill="none" stroke="url(#ring)" stroke-width="62" filter="ur