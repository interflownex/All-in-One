options:
  substitutionOption: ALL_ZERO
substitutions:
  _CLUSTER_NAME: "REPLACE_CLUSTER_NAME"
  _CLUSTER_ZONE: "REPLACE_CLUSTER_ZONE"
  _NAMESPACE: "all-in-one"
  _IMAGE: "REPLACE_WITH_IMAGE_URL"

steps:
  # Authenticate with GKE (requires Cloud Build service account permissions)
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud container clusters get-credentials "$_CLUSTER_NAME" --zone "$_CLUSTER_ZONE" --project "$PROJECT_ID"

  # Fetch secrets from Secret Manager and create Kubernetes Secret
  - name: "gcr.io/cloud-builders/gcloud"
    id: "create-k8s-secrets"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        DB_PASS=$(gcloud secrets versions access latest --secret=DATABASE_PASSWORD --project="$PROJECT_ID")
        JWT=$(gcloud secrets versions access latest --secret=JWT_SECRET --project="$PROJECT_ID")
        kubectl create secret generic all-in-one-secrets --namespace="$_NAMESPACE" \
          --from-literal=DATABASE_PASSWORD="$DB_PASS" \
          --from-literal=JWT_SECRET="$JWT" \
          --dry-run=client -o yaml | kubectl apply -f -

  # Apply kustomize manifests
  - name: "gcr.io/cloud-builders/kubectl"
    args: ["apply", "-k", "infra/kubernetes"]

images:
  - "$_IMAGE"

timeout: "1200s"
