apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aio-mcp-gateway
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      name: ${REVISION_NAME}
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: ${SERVICE_ACCOUNT}
      containers:
        - name: aio-mcp-gateway
          image: ${IMAGE_DIGEST}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: DEPLOYMENT_ENV
              value: production
            - name: AUTH_REQUIRED
              value: "true"
            - name: PROTECTED_RESOURCE_URL
              value: https://mcp.brasildesconto.com.br/mcp
            - name: MCP_REQUIRED_SCOPE
              value: aio:mcp:read
            - name: MCP_ALLOWED_ORIGINS
              value: https://brasildesconto.com.br,https://mcp.brasildesconto.com.br,https://mcp-staging.brasildesconto.com.br,https://mcp-preview.brasildesconto.com.br
            - name: MCP_ALLOWED_HOSTS
              value: mcp.brasildesconto.com.br
            - name: OIDC_ALGORITHMS
              value: RS256
            - name: RATE_LIMIT_REQUESTS
              value: "120"
            - name: RATE_LIMIT_WINDOW_SECONDS
              value: "60"
            - name: MAX_REQUEST_BODY_BYTES
              value: "1048576"
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: aio-mcp-oidc-issuer
                  key: latest
            - name: OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: aio-mcp-oidc-audience
                  key: latest
            - name: OIDC_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: aio-mcp-oidc-jwks-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aio-mcp-redis-url
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 30
            failureThreshold: 3
  traffic:
    - latestRevision: true
      percent: 100
