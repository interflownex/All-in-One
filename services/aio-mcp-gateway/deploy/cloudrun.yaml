apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aio-mcp-gateway
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: aio-mcp-gateway@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 30
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/aio/aio-mcp-gateway@IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: DEPLOYMENT_ENV
              value: production
            - name: AIO_MCP_AUTH_DISABLED
              value: "false"
            - name: AIO_MCP_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: aio-mcp-oidc-issuer
                  key: latest
            - name: AIO_MCP_OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: aio-mcp-oidc-audience
                  key: latest
