apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-job
  namespace: all-in-one
spec:
  template:
    spec:
      containers:
        - name: migrations
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              value: "strong-password"
          volumeMounts:
            - name: migrations-vol
              mountPath: /migrations
          command:
            - sh
            - -ec
            - |
              for db in identity_db api_hub_db jobs_db finance_db marketplace_db delivery_db wms_db tms_db erp_db health_db legal_db; do
                echo "Running migrations for $db..."
                for file in /migrations/*.sql; do
                  echo "Applying $file to $db..."
                  psql -h 10.93.0.2 -U postgres -d "$db" -v ON_ERROR_STOP=1 -f "$file"
                done
              done
      volumes:
        - name: migrations-vol
          configMap:
            name: db-migrations-cm
      restartPolicy: Never
  backoffLimit: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-migrations-cm
  namespace: all-in-one
data:
  # I'll need to populate this ConfigMap with the migration files.
  # But since there are many files, it might be better to use a container that has the files.
  # The 'migrations' image from Artifact Registry should have them.
