    NOT NULL,\n    key_hash TEXT NOT NULL UNIQUE,\n    key_hint VARCHAR(20) NOT NULL,\n
    \   scopes JSONB NOT NULL DEFAULT '[]'::jsonb,\n    expires_at TIMESTAMPTZ,\n
    \   last_used_at TIMESTAMPTZ,\n    status VARCHAR(40) NOT NULL DEFAULT 'active',\n
    \   idempotency_key VARCHAR(120) UNIQUE,\n    metadata JSONB NOT NULL DEFAULT
    '{}'::jsonb,\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    updated_at
    TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    deleted_at TIMESTAMPTZ,\n    created_by
    UUID REFERENCES identity.users(id),\n    updated_by UUID REFERENCES identity.users(id)\n);\n\nCREATE
    TABLE IF NOT EXISTS api_hub.integration_runs (\n    id UUID PRIMARY KEY DEFAULT
    gen_random_uuid(),\n    user_id UUID NOT NULL REFERENCES identity.users(id),\n
    \   company_id UUID REFERENCES business.companies(id),\n    integration_type VARCHAR(80)
    NOT NULL,\n    provider_name VARCHAR(100) NOT NULL,\n    started_at TIMESTAMPTZ
    NOT NULL DEFAULT NOW(),\n    ended_at TIMESTAMPTZ,\n    log_summary TEXT,\n    status
    VARCHAR(40) NOT NULL DEFAULT 'running',\n    idempotency_key VARCHAR(120) UNIQUE,\n
    \   metadata JSONB NOT NULL DEFAULT '{}'::jsonb,\n    created_at TIMESTAMPTZ NOT
    NULL DEFAULT NOW(),\n    updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    deleted_at
    TIMESTAMPTZ,\n    created_by UUID REFERENCES identity.users(id),\n    updated_by
    UUID REFERENCES identity.users(id)\n);\n\n-- Adicionando idempotency_key as tabelas
    existentes de api_hub se nao houver\nDO $$ \nBEGIN \n    IF NOT EXISTS (SELECT
    1 FROM information_schema.columns WHERE table_schema='api_hub' AND table_name='api_clients'
    AND column_name='idempotency_key') THEN\n        ALTER TABLE api_hub.api_clients
