    );

    CREATE INDEX IF NOT EXISTS idx_marketplace_pepita_grants_customer
        ON marketplace.pepita_grants(customer_user_id, created_at DESC);

    CREATE TABLE IF NOT EXISTS stock.discount_quotes (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        catalog_product_id UUID,
        selected_percent INTEGER NOT NULL CHECK (selected_percent IN (10, 20, 50)),
        pepitas_required INTEGER NOT NULL CHECK (pepitas_required > 0),
        status VARCHAR(40) NOT NULL DEFAULT 'quoted',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb CHECK (jsonb_typeof(metadata) = 'object'),
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        idempotency_key VARCHAR(100) UNIQUE
    );

    CREATE INDEX IF NOT EXISTS idx_stock_discount_quotes_user
        ON stock.discount_quotes(user_id, created_at DESC);

    COMMIT;
  015_valley_gold_ledger.sql: |
    BEGIN;

    CREATE TABLE IF NOT EXISTS finance.valley_gold_ledger_entries (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        merchant_business_id UUID NOT NULL REFERENCES business.companies(id),
        entry_type VARCHAR(40) NOT NULL CHECK (entry_type IN ('purchase_credit', 'pepita_grant_debit', 'manual_adjustment')),
        amount_gold_delta INTEGER NOT NULL CHECK (amount_gold_delta <> 0),
        reference_type VARCHAR(60) NOT NULL CHECK (reference_type IN ('gold_purchase', 'pepita_grant', 'manual_adjustment')),
        reference_id UUID,
        status VARCHAR(40) NOT NULL DEFAULT 'posted',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb CHECK (jsonb_typeof(metadata) = 'object'),
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        created_by UUID REFERENCES identity.users(id),
        idempotency_key TEXT NOT NULL UNIQUE,
        CHECK (
            (entry_type = 'purchase_credit' AND amount_gold_delta > 0)
            OR (entry_type = 'pepita_grant_debit' AND amount_gold_delta < 0 AND reference_id IS NOT NULL)
            OR (entry_type = 'manual_adjustment')
        )
    );

    CREATE INDEX IF NOT EXISTS idx_finance_valley_gold_merchant_created
        ON finance.valley_gold_ledger_entries(merchant_business_id, created_at DESC);

    DROP TRIGGER IF EXISTS immutable_valley_gold_ledger ON finance.valley_gold_ledger_entries;
    CREATE TRIGGER immutable_valley_gold_ledger
    BEFORE UPDATE OR DELETE ON finance.valley_gold_ledger_entries
    FOR EACH ROW EXECUTE FUNCTION audit.reject_immutable_change();

    COMMIT;
  016_compliance_retention_jobs.sql: |
    BEGIN;

    CREATE TABLE IF NOT EXISTS compliance.retention_candidates (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        module VARCHAR(80) NOT NULL,
        resource_type VARCHAR(100) NOT NULL,
        resource_id UUID NOT NULL,
        subject_id UUID REFERENCES identity.users(id),
        payload JSONB NOT NULL DEFAULT '{}'::jsonb,
        legal_hold JSONB NOT NULL DEFAULT '[]'::jsonb,
        requested_action VARCHAR(120),
        legal_review_approved BOOLEAN NOT NULL DEFAULT FALSE,
        status VARCHAR(40) NOT NULL DEFAULT 'pending'
            CHECK (status IN ('pending', 'dry_run', 'processed', 'blocked', 'failed')),
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        locked_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS compliance.retention_decisions (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        candidate_id UUID NOT NULL REFERENCES compliance.retention_candidates(id),
        module VARCHAR(80) NOT NULL,
        resource_type VARCHAR(100) NOT NULL,
        resource_id UUID NOT NULL,
        job_name VARCHAR(120) NOT NULL,
        action VARCHAR(160) NOT NULL,
        decision_status VARCHAR(40) NOT NULL,
        audit_event VARCHAR(120) NOT NULL,
        evidence JSONB NOT NULL DEFAULT '{}'::jsonb,
        payload JSONB,
        dry_run BOOLEAN NOT NULL DEFAULT FALSE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        created_by UUID REFERENCES identity.users(id)
    );

    CREATE INDEX IF NOT EXISTS idx_retention_candidates_status
        ON compliance.retention_candidates(status, created_at)
        WHERE status IN ('pending', 'failed');

    CREATE INDEX IF NOT EXISTS idx_retention_candidates_module
        ON compliance.retention_candidates(module, resource_type, resource_id);

    CREATE INDEX IF NOT EXISTS idx_retention_decisions_candidate
        ON compliance.retention_decisions(candidate_id, created_at DESC);

    COMMIT;
  017_erp_invoice_items.sql: |-
    -- Migration 017: Tabela de itens de fatura para o ERP
    -- Data: 2026-06-01

    CREATE TABLE IF NOT EXISTS erp.invoice_items (
        id UUID PRIMARY KEY,
        fiscal_document_id UUID NOT NULL REFERENCES erp.fiscal_documents(id) ON DELETE CASCADE,
        description TEXT NOT NULL,
        quantity NUMERIC(18, 4) NOT NULL DEFAULT 1,
        unit_price_brl NUMERIC(18, 4) NOT NULL,
        total_price_brl NUMERIC(18, 4) NOT NULL,
        tax_amount_brl NUMERIC(18, 4) NOT NULL DEFAULT 0,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_invoice_items_document ON erp.invoice_items (fiscal_document_id);

    COMMENT ON TABLE erp.invoice_items IS 'Itens detalhados vinculados a um documento fiscal no modulo ERP';
  018_business_catalog_offers.sql: |
    BEGIN;

    CREATE TABLE IF NOT EXISTS business.catalog_offers (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        company_id UUID REFERENCES business.companies(id),
        source_module VARCHAR(60) NOT NULL,
        source_entity_id UUID,
        offer_type VARCHAR(40) NOT NULL,
        title VARCHAR(240) NOT NULL,
        short_description TEXT,
        category_id UUID,
        business_category VARCHAR(120),
        business_type VARCHAR(80),
        activity_branch VARCHAR(120),
        price_type VARCHAR(40) NOT NULL DEFAULT 'fixed',
        price_amount NUMERIC(18, 4),
        currency VARCHAR(10) NOT NULL DEFAULT 'BRL',
        location_type VARCHAR(40) NOT NULL DEFAULT 'online',
        availability_type VARCHAR(40) NOT NULL DEFAULT 'immediate',
        status VARCHAR(40) NOT NULL DEFAULT 'draft',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        published_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        idempotency_key VARCHAR(100) UNIQUE,
        CHECK (status IN ('draft', 'pending_review', 'published', 'paused', 'rejected', 'archived'))
    );

    CREATE INDEX IF NOT EXISTS idx_business_catalog_offers_user_status ON business.catalog_offers(user_id, status, created_at);
    CREATE INDEX IF NOT EXISTS idx_business_catalog_offers_status_published ON business.catalog_offers(status) WHERE status = 'published';
    CREATE INDEX IF NOT EXISTS idx_business_catalog_offers_idempotency ON business.catalog_offers(idempotency_key) WHERE idempotency_key IS NOT NULL;

    COMMIT;
  019_valley_orders.sql: "BEGIN;\n\nALTER TABLE marketplace.orders \nADD COLUMN IF
    NOT EXISTS offer_id UUID REFERENCES business.catalog_offers(id),\nADD COLUMN IF
    NOT EXISTS company_id UUID REFERENCES business.companies(id);\n\nALTER TABLE marketplace.orders
    ALTER COLUMN store_id DROP NOT NULL;\n\n-- In postgres, status is just a VARCHAR(40)
    so we don't need to change constraints \n-- unless there is a specific check constraint
    on status which there isn't in 003_marketplace.\n\nCOMMIT;\n"
  020_valley_services_health_sprint3.sql: |
    BEGIN;

    -- For services.service_contracts
    ALTER TABLE services.service_contracts
    ADD COLUMN IF NOT EXISTS offer_id UUID REFERENCES business.catalog_offers(id),
    ADD COLUMN IF NOT EXISTS company_id UUID REFERENCES business.companies(id),
    ADD COLUMN IF NOT EXISTS scheduled_at TIMESTAMPTZ;

    ALTER TABLE services.service_contracts
    ALTER COLUMN provider_user_id DROP NOT NULL;

    ALTER TABLE services.service_contracts
    ALTER COLUMN escrow_id DROP NOT NULL;

    -- For health.appointments
    ALTER TABLE health.appointments
    ADD COLUMN IF NOT EXISTS offer_id UUID REFERENCES business.catalog_offers(id),
    ADD COLUMN IF NOT EXISTS company_id UUID REFERENCES business.companies(id);

    ALTER TABLE health.appointments
    ALTER COLUMN patient_id DROP NOT NULL;

    ALTER TABLE health.appointments
    ALTER COLUMN professional_user_id DROP NOT NULL;

    COMMIT;
  021_valley_reviews.sql: |
    BEGIN;

    CREATE TABLE IF NOT EXISTS marketplace.reviews (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        order_id UUID NOT NULL REFERENCES marketplace.orders(id),
        store_id UUID REFERENCES marketplace.stores(id),
        offer_id TEXT,
        rating SMALLINT NOT NULL CHECK (rating BETWEEN 1 AND 5),
        comment TEXT,
        moderation_status VARCHAR(40) NOT NULL DEFAULT 'published',
        status VARCHAR(40) NOT NULL DEFAULT 'published',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        idempotency_key TEXT,
        UNIQUE (order_id, user_id),
        UNIQUE (idempotency_key)
    );

    -- Compatibilidade com ambientes que executaram a migration 013 antiga, na
    -- qual reviews era criada como tabela generica.
    ALTER TABLE marketplace.reviews
        ADD COLUMN IF NOT EXISTS order_id UUID REFERENCES marketplace.orders(id),
        ADD COLUMN IF NOT EXISTS store_id UUID REFERENCES marketplace.stores(id),
        ADD COLUMN IF NOT EXISTS offer_id TEXT,
        ADD COLUMN IF NOT EXISTS rating SMALLINT,
        ADD COLUMN IF NOT EXISTS comment TEXT,
        ADD COLUMN IF NOT EXISTS moderation_status VARCHAR(40) NOT NULL DEFAULT 'published';

    DO $$
    BEGIN
        IF NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conname = 'marketplace_reviews_order_required'
              AND conrelid = 'marketplace.reviews'::regclass
        ) THEN
            ALTER TABLE marketplace.reviews
                ADD CONSTRAINT marketplace_reviews_order_required
                CHECK (order_id IS NOT NULL) NOT VALID;
        END IF;
        IF NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conname = 'marketplace_reviews_rating_range'
              AND conrelid = 'marketplace.reviews'::regclass
        ) THEN
            ALTER TABLE marketplace.reviews
                ADD CONSTRAINT marketplace_reviews_rating_range
                CHECK (rating BETWEEN 1 AND 5) NOT VALID;
        END IF;
    END $$;

    CREATE UNIQUE INDEX IF NOT EXISTS marketplace_reviews_order_user_uidx
        ON marketplace.reviews (order_id, user_id);

    CREATE INDEX IF NOT EXISTS marketplace_reviews_store_created_idx
        ON marketplace.reviews (store_id, created_at DESC);

    COMMIT;
  022_marketplace_disputes_support.sql: |
    BEGIN;

    CREATE TABLE IF NOT EXISTS marketplace.disputes (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        order_id UUID NOT NULL REFERENCES marketplace.orders(id),
        store_id UUID REFERENCES marketplace.stores(id),
        company_id UUID REFERENCES business.companies(id),
        offer_id TEXT,
        case_type VARCHAR(40) NOT NULL,
        subject VARCHAR(200),
        message TEXT NOT NULL,
        desired_resolution TEXT,
        status VARCHAR(40) NOT NULL DEFAULT 'open',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        idempotency_key TEXT UNIQUE
    );

    -- Compatibilidade com ambientes que executaram a migration 013 antiga, na
    -- qual disputes era criada como tabela generica.
    ALTER TABLE marketplace.disputes
        ADD COLUMN IF NOT EXISTS order_id UUID REFERENCES marketplace.orders(id),
        ADD COLUMN IF NOT EXISTS store_id UUID REFERENCES marketplace.stores(id),
        ADD COLUMN IF NOT EXISTS offer_id TEXT,
        ADD COLUMN IF NOT EXISTS case_type VARCHAR(40),
        ADD COLUMN IF NOT EXISTS subject VARCHAR(200),
        ADD COLUMN IF NOT EXISTS message TEXT,
        ADD COLUMN IF NOT EXISTS desired_resolution TEXT;

    DO $$
    BEGIN
        IF NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conname = 'marketplace_disputes_order_required'
              AND conrelid = 'marketplace.disputes'::regclass
        ) THEN
            ALTER TABLE marketplace.disputes
                ADD CONSTRAINT marketplace_disputes_order_required
                CHECK (order_id IS NOT NULL) NOT VALID;
        END IF;
        IF NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conname = 'marketplace_disputes_type_required'
              AND conrelid = 'marketplace.disputes'::regclass
        ) THEN
            ALTER TABLE marketplace.disputes
                ADD CONSTRAINT marketplace_disputes_type_required
                CHECK (case_type IS NOT NULL) NOT VALID;
        END IF;
        IF NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conname = 'marketplace_disputes_message_required'
              AND conrelid = 'marketplace.disputes'::regclass
        ) THEN
            ALTER TABLE marketplace.disputes
                ADD CONSTRAINT marketplace_disputes_message_required
                CHECK (message IS NOT NULL) NOT VALID;
        END IF;
    END $$;

    CREATE INDEX IF NOT EXISTS marketplace_disputes_order_created_idx
        ON marketplace.disputes (order_id, created_at DESC);

    COMMIT;
  023_performance_indexes.sql: |
    -- Migration 023: Indices de Performance para Outbox, Auditoria e Ledger
    -- Data: 2026-06-01

    BEGIN;

    -- 1. Otimizacao do Dispatcher da Outbox (Busca por eventos prontos para envio/retry)
    ALTER TABLE audit.domain_events
        ADD COLUMN IF NOT EXISTS next_retry_at TIMESTAMPTZ;

    UPDATE audit.domain_events
    SET next_retry_at = (metadata->>'next_retry_at')::timestamptz
    WHERE next_retry_at IS NULL
      AND metadata->>'next_retry_at' IS NOT NULL;

    CREATE INDEX IF NOT EXISTS idx_outbox_dispatcher_ready
    ON audit.domain_events (next_retry_at, created_at, id)
    WHERE status = 'pending' AND published_at IS NULL;

    -- 2. Rastreabilidade Transversal (Busca por Correlation ID nos eventos)
    CREATE INDEX IF NOT EXISTS idx_audit_events_correlation ON audit.domain_events (correlation_id);

    -- 3. Performance de Saldo e Extrato (Finance e Gold Valley)
    CREATE INDEX IF NOT EXISTS idx_finance_ledger_wallet_lookup
    ON finance.ledger_entries (wallet_id, created_at DESC);

    CREATE INDEX IF NOT EXISTS idx_finance_gold_ledger_entity_lookup
    ON finance.valley_gold_ledger_entries (merchant_business_id, created_at DESC);

    -- 4. Otimizacao de Busca em Jobs (Visibilidade de Curriculos para Recrutadores)
    CREATE INDEX IF NOT EXISTS idx_jobs_resumes_visibility
    ON jobs.resumes (recruiter_visibility, status);

    -- 5. Otimizacao de Busca em Business (Lookup de Membros por Empresa)
    CREATE INDEX IF NOT EXISTS idx_business_membership_lookup ON business.user_company_memberships (company_id, status);

    -- 6. Idempotencia da criacao de carteiras
    ALTER TABLE finance.wallets
        ADD COLUMN IF NOT EXISTS idempotency_key VARCHAR(120);

    CREATE UNIQUE INDEX IF NOT EXISTS finance_wallets_idempotency_uidx
    ON finance.wallets (idempotency_key)
    WHERE idempotency_key IS NOT NULL;

    COMMENT ON INDEX audit.idx_outbox_dispatcher_ready IS 'Acelera a selecao de eventos pendentes pelo worker outbox-dispatcher';
    COMMENT ON INDEX finance.idx_finance_ledger_wallet_lookup IS 'Otimiza o calculo de saldo derivado e listagem de extrato';

    COMMIT;
