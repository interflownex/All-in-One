apiVersion: v1
data:
  001_identity_and_schemas.sql: |
    BEGIN;

    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS citext;

    CREATE SCHEMA IF NOT EXISTS identity;
    CREATE SCHEMA IF NOT EXISTS business;
    CREATE SCHEMA IF NOT EXISTS permissions;
    CREATE SCHEMA IF NOT EXISTS marketplace;
    CREATE SCHEMA IF NOT EXISTS stock;
    CREATE SCHEMA IF NOT EXISTS delivery;
    CREATE SCHEMA IF NOT EXISTS services;
    CREATE SCHEMA IF NOT EXISTS mobility;
    CREATE SCHEMA IF NOT EXISTS erp;
    CREATE SCHEMA IF NOT EXISTS wms;
    CREATE SCHEMA IF NOT EXISTS tms;
    CREATE SCHEMA IF NOT EXISTS crm;
    CREATE SCHEMA IF NOT EXISTS bpm;
    CREATE SCHEMA IF NOT EXISTS document;
    CREATE SCHEMA IF NOT EXISTS finance;
    CREATE SCHEMA IF NOT EXISTS billing;
    CREATE SCHEMA IF NOT EXISTS fiscal;
    CREATE SCHEMA IF NOT EXISTS hr;
    CREATE SCHEMA IF NOT EXISTS health;
    CREATE SCHEMA IF NOT EXISTS vision;
    CREATE SCHEMA IF NOT EXISTS legal;
    CREATE SCHEMA IF NOT EXISTS property;
    CREATE SCHEMA IF NOT EXISTS audit;
    CREATE SCHEMA IF NOT EXISTS compliance;
    CREATE SCHEMA IF NOT EXISTS notifications;
    CREATE SCHEMA IF NOT EXISTS api_hub;
    CREATE SCHEMA IF NOT EXISTS insurance;
    CREATE SCHEMA IF NOT EXISTS bi;
    CREATE SCHEMA IF NOT EXISTS ai_core;

    CREATE TABLE IF NOT EXISTS identity.users (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        all_in_one_id UUID NOT NULL UNIQUE DEFAULT gen_random_uuid(),
        full_name VARCHAR(200) NOT NULL,
        cpf_document VARCHAR(32) NOT NULL UNIQUE,
        birth_date DATE NOT NULL,
        email CITEXT NOT NULL UNIQUE,
        phone_e164 VARCHAR(20) NOT NULL UNIQUE,
        password_hash TEXT NOT NULL,
        face_hash TEXT NOT NULL UNIQUE,
        liveness_score NUMERIC(5, 4) NOT NULL CHECK (liveness_score BETWEEN 0 AND 1),
        document_status VARCHAR(40) NOT NULL DEFAULT 'pending_validation',
        kyc_status VARCHAR(40) NOT NULL DEFAULT 'pending_validation',
        mfa_required BOOLEAN NOT NULL DEFAULT TRUE,
        terms_accepted_at TIMESTAMPTZ NOT NULL,
        lgpd_consent_at TIMESTAMPTZ NOT NULL,
        default_wallet_id UUID,
        primary_led_card_id UUID,
        status VARCHAR(40) NOT NULL DEFAULT 'pending_validation',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb CHECK (jsonb_typeof(metadata) = 'object'),
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID,
        updated_by UUID,
        CONSTRAINT users_cpf_document_format CHECK (cpf_document ~ '^[0-9A-Za-z.-]{5,32}$'),
        CONSTRAINT users_phone_format CHECK (phone_e164 ~ '^\+[1-9][0-9]{7,14}$')
    );

    CREATE TABLE IF NOT EXISTS identity.documents (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        document_type VARCHAR(60) NOT NULL,
        document_number_hash TEXT NOT NULL,
        storage_key TEXT NOT NULL,
        expires_at DATE,
        verification_status VARCHAR(40) NOT NULL DEFAULT 'pending_review',
        status VARCHAR(40) NOT NULL DEFAULT 'active',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        UNIQUE (user_id, document_type, document_number_hash)
    );

    CREATE TABLE IF NOT EXISTS identity.biometrics (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL UNIQUE REFERENCES identity.users(id),
        face_hash TEXT NOT NULL UNIQUE,
        provider_reference TEXT,
        last_liveness_score NUMERIC(5, 4) CHECK (last_liveness_score BETWEEN 0 AND 1),
        consent_recorded_at TIMESTAMPTZ NOT NULL,
        status VARCHAR(40) NOT NULL DEFAULT 'pending_validation',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS identity.mfa_devices (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        method VARCHAR(30) NOT NULL CHECK (method IN ('totp', 'sms', 'email', 'passkey', 'biometric')),
        secret_reference TEXT NOT NULL,
        verified_at TIMESTAMPTZ,
        status VARCHAR(40) NOT NULL DEFAULT 'pending_validation',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS identity.sessions (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        token_hash TEXT NOT NULL UNIQUE,
        device_fingerprint TEXT NOT NULL,
        ip_address INET NOT NULL,
        user_agent TEXT,
        expires_at TIMESTAMPTZ NOT NULL,
        revoked_at TIMESTAMPTZ,
        status VARCHAR(40) NOT NULL DEFAULT 'active',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS identity.identity_verifications (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        verification_type VARCHAR(50) NOT NULL,
        risk_score NUMERIC(5, 4) CHECK (risk_score BETWEEN 0 AND 1),
        reviewer_user_id UUID REFERENCES identity.users(id),
        decision_reason TEXT,
        status VARCHAR(40) NOT NULL DEFAULT 'pending_review',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS identity.consent_records (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        consent_type VARCHAR(60) NOT NULL,
        policy_version VARCHAR(30) NOT NULL,
        accepted_at TIMESTAMPTZ NOT NULL,
        revoked_at TIMESTAMPTZ,
        ip_address INET,
        status VARCHAR(40) NOT NULL DEFAULT 'accepted',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS identity.duplicate_attempts (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID REFERENCES identity.users(id),
        cpf_document_hash TEXT,
        face_hash TEXT,
        email_hash TEXT,
        device_fingerprint TEXT,
        ip_address INET,
        blocked_reason TEXT NOT NULL,
        status VARCHAR(40) NOT NULL DEFAULT 'blocked',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE INDEX IF NOT EXISTS idx_identity_documents_user ON identity.documents(user_id);
    CREATE INDEX IF NOT EXISTS idx_identity_sessions_user_active ON identity.sessions(user_id, status);

    COMMIT;
  002_business_permissions_finance.sql: |
    BEGIN;

    CREATE TABLE IF NOT EXISTS business.companies (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        parent_company_id UUID REFERENCES business.companies(id),
        cnpj VARCHAR(18) NOT NULL UNIQUE,
        root_cnpj VARCHAR(18) NOT NULL,
        legal_name VARCHAR(240) NOT NULL,
        trade_name VARCHAR(240),
        cnae VARCHAR(20),
        state_registration VARCHAR(40),
        municipal_registration VARCHAR(40),
        legal_representative_user_id UUID NOT NULL REFERENCES identity.users(id),
        submitted_at TIMESTAMPTZ,
        approved_at TIMESTAMPTZ,
        approved_by UUID REFERENCES identity.users(id),
        rejection_reason TEXT,
        status VARCHAR(40) NOT NULL DEFAULT 'pending_validation',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        CHECK (status IN ('draft', 'pending_documents', 'pending_validation', 'under_review', 'approved', 'active', 'rejected', 'blocked', 'suspended', 'archived'))
    );

    CREATE TABLE IF NOT EXISTS business.company_documents (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        company_id UUID NOT NULL REFERENCES business.companies(id),
        document_type VARCHAR(80) NOT NULL,
        storage_key TEXT NOT NULL,
        expires_at DATE,
        status VARCHAR(40) NOT NULL DEFAULT 'pending_review',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS business.user_company_memberships (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        company_id UUID NOT NULL REFERENCES business.companies(id),
        department VARCHAR(100),
        cost_center VARCHAR(100),
        status VARCHAR(40) NOT NULL DEFAULT 'pending_invitation',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        UNIQUE (user_id, company_id)
    );

    CREATE TABLE IF NOT EXISTS permissions.roles (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        company_id UUID REFERENCES business.companies(id),
        name VARCHAR(80) NOT NULL,
        is_system BOOLEAN NOT NULL DEFAULT FALSE,
        status VARCHAR(40) NOT NULL DEFAULT 'active',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS permissions.permissions (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        module VARCHAR(60) NOT NULL,
        action VARCHAR(40) NOT NULL,
        status VARCHAR(40) NOT NULL DEFAULT 'active',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        UNIQUE (user_id, module, action)
    );

    CREATE TABLE IF NOT EXISTS permissions.user_roles (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        role_id UUID NOT NULL REFERENCES permissions.roles(id),
        company_id UUID REFERENCES business.companies(id),
        valid_until TIMESTAMPTZ,
        status VARCHAR(40) NOT NULL DEFAULT 'active',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS permissions.access_policies (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        company_id UUID REFERENCES business.companies(id),
        module VARCHAR(60) NOT NULL,
        expression JSONB NOT NULL CHECK (jsonb_typeof(expression) = 'object'),
        status VARCHAR(40) NOT NULL DEFAULT 'active',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS permissions.approval_limits (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        company_id UUID REFERENCES business.companies(id),
        role_id UUID REFERENCES permissions.roles(id),
        limit_brl NUMERIC(18, 4),
        requires_dual_approval BOOLEAN NOT NULL DEFAULT FALSE,
        scope VARCHAR(60) NOT NULL,
        status VARCHAR(40) NOT NULL DEFAULT 'active',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        CHECK (limit_brl IS NULL OR limit_brl >= 0)
    );

    CREATE TABLE IF NOT EXISTS finance.wallets (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        wallet_type VARCHAR(30) NOT NULL DEFAULT 'personal',
        brl_available NUMERIC(18, 4) NOT NULL DEFAULT 0 CHECK (brl_available >= 0),
        brl_held NUMERIC(18, 4) NOT NULL DEFAULT 0 CHECK (brl_held >= 0),
        nex_available NUMERIC(18, 8) NOT NULL DEFAULT 0 CHECK (nex_available >= 0),
        nex_held NUMERIC(18, 8) NOT NULL DEFAULT 0 CHECK (nex_held >= 0),
        status VARCHAR(40) NOT NULL DEFAULT 'active',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        UNIQUE (id, user_id)
    );

    CREATE TABLE IF NOT EXISTS finance.ledger_entries (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        wallet_id UUID NOT NULL,
        counterparty_user_id UUID REFERENCES identity.users(id),
        currency VARCHAR(10) NOT NULL CHECK (currency IN ('BRL', 'NEX')),
        amount_brl NUMERIC(18, 4),
        amount_nex NUMERIC(18, 8),
        entry_type VARCHAR(40) NOT NULL,
        reference_type VARCHAR(60),
        reference_id UUID,
        idempotency_key TEXT NOT NULL UNIQUE,
        status VARCHAR(40) NOT NULL DEFAULT 'posted',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        created_by UUID REFERENCES identity.users(id),
        CONSTRAINT ledger_wallet_owner_fk FOREIGN KEY (wallet_id, user_id) REFERENCES finance.wallets(id, user_id),
        CHECK ((currency = 'BRL' AND amount_brl IS NOT NULL AND amount_nex IS NULL) OR
               (currency = 'NEX' AND amount_nex IS NOT NULL AND amount_brl IS NULL))
    );

    CREATE TABLE IF NOT EXISTS finance.escrows (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        wallet_id UUID NOT NULL,
        beneficiary_user_id UUID NOT NULL REFERENCES identity.users(id),
        amount_brl NUMERIC(18, 4) NOT NULL CHECK (amount_brl > 0),
        release_condition JSONB NOT NULL DEFAULT '{}'::jsonb,
        dispute_deadline TIMESTAMPTZ,
        status VARCHAR(40) NOT NULL DEFAULT 'created',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        CONSTRAINT escrow_wallet_owner_fk FOREIGN KEY (wallet_id, user_id) REFERENCES finance.wallets(id, user_id),
        CHECK (status IN ('created', 'authorized', 'captured', 'held', 'released', 'partially_released', 'refunded', 'disputed', 'cancelled', 'expired'))
    );

    CREATE TABLE IF NOT EXISTS identity.led_cards (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        wallet_id UUID NOT NULL,
        card_uid_hash TEXT NOT NULL UNIQUE,
        nfc_public_token_hash TEXT UNIQUE,
        activated_at TIMESTAMPTZ,
        status VARCHAR(40) NOT NULL DEFAULT 'issued',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        CONSTRAINT led_card_wallet_owner_fk FOREIGN KEY (wallet_id, user_id) REFERENCES finance.wallets(id, user_id),
        UNIQUE (id, user_id)
    );

    DO $$
    BEGIN
        IF NOT EXISTS (
            SELECT 1 FROM pg_constraint WHERE conname = 'users_default_wallet_fk'
        ) THEN
            ALTER TABLE identity.users
                ADD CONSTRAINT users_default_wallet_fk
                FOREIGN KEY (default_wallet_id, id) REFERENCES finance.wallets(id, user_id)
                DEFERRABLE INITIALLY DEFERRED;
        END IF;
        IF NOT EXISTS (
            SELECT 1 FROM pg_constraint WHERE conname = 'users_primary_led_card_fk'
        ) THEN
            ALTER TABLE identity.users
                ADD CONSTRAINT users_primary_led_card_fk
                FOREIGN KEY (primary_led_card_id, id) REFERENCES identity.led_cards(id, user_id)
                DEFERRABLE INITIALLY DEFERRED;
        END IF;
    END $$;

    CREATE INDEX IF NOT EXISTS idx_business_companies_owner ON business.companies(user_id);
    CREATE INDEX IF NOT EXISTS idx_finance_wallets_user ON finance.wallets(user_id);
    CREATE INDEX IF NOT EXISTS idx_finance_ledger_wallet_created ON finance.ledger_entries(wallet_id, created_at);

    COMMIT;
  003_marketplace_delivery_services_mobility.sql: |
    BEGIN;

    CREATE TABLE IF NOT EXISTS delivery.rider_profiles (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL UNIQUE REFERENCES identity.users(id),
        wallet_id UUID NOT NULL,
        cnh_number_hash TEXT,
        cnh_category VARCHAR(10),
        document_expiry DATE,
        proof_of_life_at TIMESTAMPTZ,
        approved_by UUID REFERENCES identity.users(id),
        status VARCHAR(40) NOT NULL DEFAULT 'pending_documents',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        CONSTRAINT rider_wallet_owner_fk FOREIGN KEY (wallet_id, user_id) REFERENCES finance.wallets(id, user_id)
    );

    CREATE TABLE IF NOT EXISTS delivery.vehicles (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        rider_profile_id UUID NOT NULL REFERENCES delivery.rider_profiles(id),
        type VARCHAR(40) NOT NULL,
        license_plate VARCHAR(12),
        capacity_kg NUMERIC(12, 3),
        refrigerated BOOLEAN NOT NULL DEFAULT FALSE,
        approved_at TIMESTAMPTZ,
        status VARCHAR(40) NOT NULL DEFAULT 'pending_review',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS marketplace.stores (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        company_id UUID NOT NULL REFERENCES business.companies(id),
        name VARCHAR(200) NOT NULL,
        published_at TIMESTAMPTZ,
        status VARCHAR(40) NOT NULL DEFAULT 'pending_validation',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS marketplace.products (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        store_id UUID NOT NULL REFERENCES marketplace.stores(id),
        sku VARCHAR(100) NOT NULL,
        name VARCHAR(240) NOT NULL,
        price_brl NUMERIC(18, 4) NOT NULL CHECK (price_brl >= 0),
        stock_quantity NUMERIC(18, 4) NOT NULL DEFAULT 0,
        status VARCHAR(40) NOT NULL DEFAULT 'draft',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id),
        UNIQUE (store_id, sku)
    );

    CREATE TABLE IF NOT EXISTS marketplace.orders (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        store_id UUID NOT NULL REFERENCES marketplace.stores(id),
        escrow_id UUID REFERENCES finance.escrows(id),
        total_brl NUMERIC(18, 4) NOT NULL CHECK (total_brl >= 0),
        commission_brl NUMERIC(18, 4) NOT NULL DEFAULT 0 CHECK (commission_brl >= 0),
        status VARCHAR(40) NOT NULL DEFAULT 'created',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS stock.suppliers (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        company_id UUID NOT NULL REFERENCES business.companies(id),
        homologated_at TIMESTAMPTZ,
        api_configuration JSONB NOT NULL DEFAULT '{}'::jsonb,
        status VARCHAR(40) NOT NULL DEFAULT 'pending_validation',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS stock.catalog_products (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        supplier_id UUID NOT NULL REFERENCES stock.suppliers(id),
        external_sku VARCHAR(120) NOT NULL,
        cost_brl NUMERIC(18, 4) NOT NULL CHECK (cost_brl >= 0),
        markup_percent NUMERIC(7, 4) NOT NULL DEFAULT 0 CHECK (markup_percent >= 0),
        status VARCHAR(40) NOT NULL DEFAULT 'draft',
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at TIMESTAMPTZ,
        created_by UUID REFERENCES identity.users(id),
        updated_by UUID REFERENCES identity.users(id)
    );

    CREATE TABLE IF NOT EXISTS delivery.delivery_requests (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES identity.users(id),
        assigned_rider_user_id UUID REFERENCES identity.users(id),
        escrow_id UUID REFERENCES finance.escrows(id),
        service_type VARCHAR(40) NOT NULL,
        origin JSONB NOT NULL,
        destination JSONB NOT NULL,
        distance_km NUMERIC(12, 3),
        weight_kg NUMERIC(12, 3),
