  013_catalog_entity_backfill.sql: |
    BEGIN;

    DO $$
    DECLARE
        item RECORD;
    BEGIN
        FOR item IN
            SELECT *
            FROM (
                VALUES
                    ('business', 'branches'),
                    ('finance', 'splits'),
                    ('finance', 'invoices'),
                    ('marketplace', 'carts'),
                    ('marketplace', 'reviews'),
