apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-hub
  namespace: all-in-one
  labels:
    app: api-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-hub
  template:
    metadata:
      labels:
        app: api-hub
    spec:
      containers:
      - name: api-hub
        image: us-central1-docker.pkg.dev/all-in-one-498012/all-in-one-repo/api-hub:latest
        ports:
        - containerPort: 8000
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "all-in-one-498012"
        - name: ALL_IN_ONE_API_HUB_POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: api-hub-dsn
        - name: REDIS_URL
          value: "redis://all-in-one-cache.us-central1.cloudmemorystore.google.com:6379"
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-hub
  namespace: all-in-one
spec:
  selector:
    app: api-hub
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
