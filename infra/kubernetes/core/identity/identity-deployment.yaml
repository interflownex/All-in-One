apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: all-in-one
  labels:
    app: identity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
      - name: identity
        image: us-central1-docker.pkg.dev/all-in-one-498012/all-in-one-repo/identity:latest
        ports:
        - containerPort: 8000
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "all-in-one-498012"
        - name: ALL_IN_ONE_IDENTITY_POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: identity-dsn
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: all-in-one
spec:
  selector:
    app: identity
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
