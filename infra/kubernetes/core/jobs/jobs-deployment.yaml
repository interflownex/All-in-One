apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs
  namespace: all-in-one
  labels:
    app: jobs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobs
  template:
    metadata:
      labels:
        app: jobs
    spec:
      containers:
        - name: jobs
          image: us-central1-docker.pkg.dev/all-in-one-498012/all-in-one-repo/jobs:latest
          ports:
            - containerPort: 8000
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "all-in-one-498012"
            - name: ALL_IN_ONE_JOBS_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: jobs-dsn
            - name: ALL_IN_ONE_DOCUMENT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: document-key
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jobs
  namespace: all-in-one
spec:
  selector:
    app: jobs
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
