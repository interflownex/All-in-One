apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp
  namespace: all-in-one
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp
  template:
    metadata:
      labels:
        app: erp
    spec:
      containers:
        - name: erp
          image: us-central1-docker.pkg.dev/all-in-one-498012/all-in-one-repo/erp:latest
          ports:
            - containerPort: 8000
          env:
            - name: ALL_IN_ONE_ERP_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: erp-dsn
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: erp
  namespace: all-in-one
spec:
  selector:
    app: erp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
