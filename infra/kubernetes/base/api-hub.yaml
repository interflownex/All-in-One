---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-hub
  namespace: all-in-one
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-hub}
  template:
    metadata:
      labels: {app: api-hub}
    spec:
      containers:
        - name: api-hub
          image: us-central1-docker.pkg.dev/all-in-one-498012/all-in-one-repo/api-hub:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          envFrom:
            - configMapRef: {name: platform-config}
            - secretRef: {name: platform-secrets-placeholder}
          env:
            - name: ALL_IN_ONE_ENVIRONMENT
              value: production
            - name: VALLEY_RESPONSE_SIGNING_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: valley-response-signing
                  key: private-key-b64
            - name: VALLEY_MEDIA_CDN_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: valley-media-cdn
                  key: base-url
---
apiVersion: v1
kind: Service
metadata:
  name: api-hub
  namespace: all-in-one
spec:
  selector: {app: api-hub}
  ports: [{port: 80, targetPort: 8000}]
