---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-dispatcher
  namespace: all-in-one
spec:
  replicas: 2
  selector:
    matchLabels: { app: outbox-dispatcher }
  template:
    metadata:
      labels: { app: outbox-dispatcher }
    spec:
      containers:
        - name: outbox-dispatcher
          image: us-central1-docker.pkg.dev/all-in-one-498012/all-in-one-repo/outbox-dispatcher:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - workers.outbox_dispatcher.main
                - --metrics
            timeoutSeconds: 5
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets-placeholder }
---
apiVersion: v1
kind: Service
metadata:
  name: outbox-dispatcher
  namespace: all-in-one
spec:
  selector: { app: outbox-dispatcher }
  ports: [{ port: 80, targetPort: 8000 }]
