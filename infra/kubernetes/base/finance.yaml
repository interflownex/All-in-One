---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance
  namespace: all-in-one
spec:
  replicas: 2
  selector:
    matchLabels: {app: finance}
  template:
    metadata:
      labels: {app: finance}
    spec:
      containers:
        - name: finance
          image: us-central1-docker.pkg.dev/all-in-one-498012/all-in-one-repo/finance:latest
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}}
          envFrom:
            - configMapRef: {name: platform-config}
            - secretRef: {name: platform-secrets-placeholder}
---
apiVersion: v1
kind: Service
metadata:
  name: finance
  namespace: all-in-one
spec:
  selector: {app: finance}
  ports: [{port: 80, targetPort: 8000}]
