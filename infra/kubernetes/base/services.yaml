---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: services
  namespace: all-in-one
spec:
  replicas: 2
  selector:
    matchLabels: { app: services }
  template:
    metadata:
      labels: { app: services }
    spec:
      containers:
        - name: services
          image: us-central1-docker.pkg.dev/all-in-one-498012/all-in-one-repo/services:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets-placeholder }
---
apiVersion: v1
kind: Service
metadata:
  name: services
  namespace: all-in-one
spec:
  selector: { app: services }
  ports: [{ port: 80, targetPort: 8000 }]
