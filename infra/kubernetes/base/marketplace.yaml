---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
  namespace: all-in-one
spec:
  replicas: 2
  selector:
    matchLabels: {app: marketplace}
  template:
    metadata:
      labels: {app: marketplace}
    spec:
      containers:
        - name: marketplace
          image: us-central1-docker.pkg.dev/all-in-one-498012/all-in-one-repo/marketplace:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          envFrom:
            - configMapRef: {name: platform-config}
            - secretRef: {name: platform-secrets-placeholder}
---
apiVersion: v1
kind: Service
metadata:
  name: marketplace
  namespace: all-in-one
spec:
  selector: {app: marketplace}
  ports: [{port: 80, targetPort: 8000}]
