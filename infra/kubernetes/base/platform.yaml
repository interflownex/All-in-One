apiVersion: v1
kind: Namespace
metadata:
  name: all-in-one
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: all-in-one
data:
  EVENT_BUS: rabbitmq
  LOG_LEVEL: info
  ALL_IN_ONE_ENV: production
  VALLEY_ANDROID_PACKAGE_NAME: com.example.valley
  VALLEY_PLAY_INTEGRITY_MAX_AGE_SECONDS: "120"
  ALL_IN_ONE_OUTBOX_EXCHANGE: all-in-one.domain
  ALL_IN_ONE_OUTBOX_BATCH_SIZE: "100"
  ALL_IN_ONE_OUTBOX_POLL_SECONDS: "1"
  ALL_IN_ONE_RETENTION_BATCH_SIZE: "100"
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets-placeholder
  namespace: all-in-one
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_VAULT_REFERENCE
  JWT_SIGNING_KEY: REPLACE_WITH_VAULT_REFERENCE
  ALL_IN_ONE_OUTBOX_POSTGRES_DSN: REPLACE_WITH_VAULT_REFERENCE
  ALL_IN_ONE_RABBITMQ_URL: REPLACE_WITH_VAULT_REFERENCE
  ALL_IN_ONE_RETENTION_POSTGRES_DSN: REPLACE_WITH_VAULT_REFERENCE
  VALLEY_PLAY_APP_SIGNING_CERT_SHA256: REPLACE_WITH_SECRET_MANAGER_REFERENCE
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hub
  namespace: all-in-one
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api-hub}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  namespace: all-in-one
spec:
  rules:
    - host: api.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: api-hub, port: {number: 80}}
