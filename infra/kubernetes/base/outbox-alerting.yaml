apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: outbox-dispatcher-alerts
  namespace: all-in-one
  labels:
    app: outbox-dispatcher
    domain: operations
    data-classification: operational
spec:
  groups:
    - name: all-in-one.outbox-dispatcher
      rules:
        - alert: OutboxPublishStalled
          expr: all_in_one_outbox_pending > 0 and increase(all_in_one_outbox_published_total[1h]) == 0
          for: 15m
          labels:
            severity: critical
            service: outbox-dispatcher
            domain: operations
          annotations:
            summary: A outbox possui pendencias, mas nao publica eventos ha uma janela operacional.
            runbook_url: docs/OPERATIONS.md#outbox
            evidence: pending_count,published_delta,worker_logs,incident_ticket
        - alert: OutboxBacklogHigh
          expr: all_in_one_outbox_pending > 500
          for: 30m
          labels:
            severity: high
            service: outbox-dispatcher
            domain: operations
          annotations:
            summary: Backlog de eventos pendentes acima do limite operacional.
            runbook_url: docs/OPERATIONS.md#outbox
            evidence: pending_count,due_count,oldest_pending_age_seconds,incident_ticket
        - alert: OutboxDueHigh
          expr: all_in_one_outbox_due > 100
          for: 15m
          labels:
            severity: high
            service: outbox-dispatcher
            domain: operations
          annotations:
            summary: Eventos prontos para retry acima do limite operacional.
            runbook_url: docs/OPERATIONS.md#outbox
            evidence: due_count,pending_count,retry_window,incident_ticket
        - alert: OutboxRetryFailuresHigh
          expr: increase(all_in_one_outbox_failed_retryable_total[30m]) > 0
          for: 15m
          labels:
            severity: medium
            service: outbox-dispatcher
            domain: operations
          annotations:
            summary: Tentativas retryable falharam recentemente.
            runbook_url: docs/OPERATIONS.md#outbox
            evidence: failed_retryable_delta,max_retry_count,worker_logs,incident_ticket
        - alert: OutboxOldestPendingTooOld
          expr: all_in_one_outbox_oldest_pending_age_seconds > 3600
          for: 10m
          labels:
            severity: critical
            service: outbox-dispatcher
            domain: operations
          annotations:
            summary: Evento pendente mais antigo ultrapassou uma hora.
            runbook_url: docs/OPERATIONS.md#outbox
            evidence: oldest_pending_age_seconds,pending_count,incident_ticket
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: outbox-dispatcher-routing
  namespace: all-in-one
  labels:
    app: outbox-dispatcher
    domain: operations
spec:
  route:
    receiver: operations-oncall
    groupBy: ["alertname", "service", "domain"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 2h
    matchers:
      - name: service
        value: outbox-dispatcher
        matchType: =
    routes:
      - receiver: platform-oncall
        matchers:
          - name: severity
            value: critical
            matchType: =
  receivers:
    - name: operations-oncall
    - name: platform-oncall
