apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: outbox-dispatcher-alerts
  namespace: all-in-one
  labels:
    app: outbox-dispatcher
    domain: events
    data-classification: operational
spec:
  groups:
    - name: all-in-one.outbox-dispatcher
      rules:
        - alert: OutboxBacklogHigh
          expr: all_in_one_outbox_pending > 1000
          for: 15m
          labels:
            severity: high
            service: outbox-dispatcher
            domain: events
          annotations:
            summary: Fila de eventos pendentes da outbox acima do limite operacional.
            runbook_url: docs/OPERATIONS.md#outbox
            evidence: pending_count,due_count,dispatcher_logs,incident_ticket
        - alert: OutboxOldestPendingTooOld
          expr: all_in_one_outbox_oldest_pending_age_seconds > 1800
          for: 10m
          labels:
            severity: critical
            service: outbox-dispatcher
            domain: events
          annotations:
            summary: Evento pendente mais antigo da outbox excedeu o SLA operacional.
            runbook_url: docs/OPERATIONS.md#outbox
            evidence: oldest_pending_age_seconds,event_selector_hash,dispatcher_logs,incident_ticket
        - alert: OutboxRetryableFailuresHigh
          expr: increase(all_in_one_outbox_failed_retryable_total[15m]) > 10
          for: 10m
          labels:
            severity: high
            service: outbox-dispatcher
            domain: events
          annotations:
            summary: Falhas retryable de publicacao da outbox cresceram na janela recente.
            runbook_url: docs/OPERATIONS.md#outbox
            evidence: failed_retryable_delta,last_error_type,rabbitmq_status,incident_ticket
        - alert: OutboxDueWithoutDeliveries
          expr: all_in_one_outbox_due > 0 and increase(all_in_one_outbox_published_total[15m]) == 0
          for: 15m
          labels:
            severity: medium
            service: outbox-dispatcher
            domain: events
          annotations:
            summary: Ha eventos prontos para entrega, mas nenhuma publicacao recente confirmada.
            runbook_url: docs/OPERATIONS.md#outbox
            evidence: due_count,published_delta,dispatcher_pod_status,incident_ticket
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: outbox-dispatcher-routing
  namespace: all-in-one
  labels:
    app: outbox-dispatcher
    domain: events
spec:
  route:
    receiver: platform-oncall
    groupBy: ["alertname", "service", "domain"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 2h
    matchers:
      - name: service
        value: outbox-dispatcher
        matchType: =
  receivers:
    - name: platform-oncall
