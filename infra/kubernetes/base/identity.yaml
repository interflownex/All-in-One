---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-play-integrity
  namespace: all-in-one
  annotations:
    iam.gke.io/gcp-service-account: identity-play-integrity@all-in-one-498012.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: all-in-one
spec:
  replicas: 2
  selector:
    matchLabels: { app: identity }
  template:
    metadata:
      labels: { app: identity }
    spec:
      serviceAccountName: identity-play-integrity
      automountServiceAccountToken: true
      containers:
        - name: identity
          image: us-central1-docker.pkg.dev/all-in-one-498012/all-in-one-repo/identity:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets-placeholder }
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: all-in-one
spec:
  selector: { app: identity }
  ports: [{ port: 80, targetPort: 8000 }]
