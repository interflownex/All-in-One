---
apiVersion: v1
kind: ConfigMap
metadata:
  name: outbox-dispatcher-dashboard
  namespace: all-in-one
  labels:
    app: outbox-dispatcher
    domain: operations
    grafana_dashboard: "1"
data:
  outbox-dispatcher-dashboard.json: |-
    {
      "uid": "outbox-dispatcher",
      "title": "All-in-One - Outbox Dispatcher",
      "tags": [
        "all-in-one",
        "outbox",
        "operations"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pendentes",
          "datasource": {
            "type": "prometheus",
            "uid": "PROMETHEUS"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "all_in_one_outbox_pending"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 100
                  },
                  {
                    "color": "red",
                    "value": 500
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Prontos para retry",
          "datasource": {
            "type": "prometheus",
            "uid": "PROMETHEUS"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "all_in_one_outbox_due"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 25
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Publicados",
          "datasource": {
            "type": "prometheus",
            "uid": "PROMETHEUS"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "all_in_one_outbox_published_total"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Falhas retryable",
          "datasource": {
            "type": "prometheus",
            "uid": "PROMETHEUS"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "all_in_one_outbox_failed_retryable_total"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Maior retry observado",
          "datasource": {
            "type": "prometheus",
            "uid": "PROMETHEUS"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "all_in_one_outbox_max_retry_count"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Idade do pendente mais antigo",
          "datasource": {
            "type": "prometheus",
            "uid": "PROMETHEUS"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "all_in_one_outbox_oldest_pending_age_seconds"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Tendencia do backlog",
          "datasource": {
            "type": "prometheus",
            "uid": "PROMETHEUS"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "expr": "all_in_one_outbox_pending",
              "legendFormat": "pendentes"
            },
            {
              "refId": "B",
              "expr": "all_in_one_outbox_due",
              "legendFormat": "prontos para retry"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Tendencia de publicacoes e falhas",
          "datasource": {
            "type": "prometheus",
            "uid": "PROMETHEUS"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(all_in_one_outbox_published_total[5m])",
              "legendFormat": "publicados/s"
            },
            {
              "refId": "B",
              "expr": "rate(all_in_one_outbox_failed_retryable_total[5m])",
              "legendFormat": "falhas retryable/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        }
      ]
    }
