steps:
  # 1. Download Android SDK and Build Tools (Using a community builder or custom steps)
  # Note: For production, use a pre-built image with Android SDK
  - name: "gcr.io/cloud-builders/docker"
    id: "build-android-builder"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/all-in-one-repo/android-builder:latest",
        "-f",
        "infra/docker/android-builder.Dockerfile",
        ".",
      ]

  # 2. Build the APK using the newly created builder
  - name: "us-central1-docker.pkg.dev/$PROJECT_ID/all-in-one-repo/android-builder:latest"
    id: "assemble-apk"
    args: ["./gradlew", "assembleDebug"]
    dir: "apps/valley-android"

  # 3. Upload the APK to the public bucket using our new script
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-apk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        python3 scripts/deploy_mobile_artifacts.py --project $PROJECT_ID

artifacts:
  objects:
    location: "gs://all-in-one-public-artifacts/"
    paths:
      - "apps/valley-android/app/build/outputs/apk/debug/app-debug.apk"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_32"
